framework:
  name: "HIPAA Security Rule"
  short_name: "hipaa_security"
  version: "45 CFR Part 164 Subpart C"
  description: >
    HIPAA Security Rule safeguards across Administrative, Physical, and Technical
    safeguard categories.

controls:
  - id: "HIPAA.AS.1"
    title: "Security Officer Designation"
    section: "Administrative Safeguards (§164.308)"
    description: "Assign a security official responsible for security policy development and implementation."
    implementation_guidance: "Required. Establish formal designation records and defined authority."
  - id: "HIPAA.AS.2"
    title: "Workforce Training and Management"
    section: "Administrative Safeguards (§164.308)"
    description: "Implement workforce security and ensure appropriate authorization/supervision."
    implementation_guidance: "Required with addressable implementation specifications under workforce security."
  - id: "HIPAA.AS.3"
    title: "Information Access Management"
    section: "Administrative Safeguards (§164.308)"
    description: "Implement policies for authorizing access to ePHI."
    implementation_guidance: "Required; includes addressable specs for access authorization and establishment."
  - id: "HIPAA.AS.4"
    title: "Security Awareness and Training"
    section: "Administrative Safeguards (§164.308)"
    description: "Implement a security awareness and training program for workforce members."
    implementation_guidance: "Required; addressable specs include reminders, malware protection, log-in monitoring, password management."
  - id: "HIPAA.AS.5"
    title: "Security Incident Procedures"
    section: "Administrative Safeguards (§164.308)"
    description: "Implement procedures to address security incidents."
    implementation_guidance: "Required; includes response and reporting procedures."
  - id: "HIPAA.AS.6"
    title: "Contingency Plan"
    section: "Administrative Safeguards (§164.308)"
    description: "Establish data backup, disaster recovery, and emergency mode operations."
    implementation_guidance: "Required with addressable testing/revision and criticality analysis specifications."
  - id: "HIPAA.AS.7"
    title: "Evaluation"
    section: "Administrative Safeguards (§164.308)"
    description: "Perform periodic technical and nontechnical evaluations."
    implementation_guidance: "Required. Evaluate operational changes affecting ePHI security."
  - id: "HIPAA.AS.8"
    title: "Business Associate Contracts"
    section: "Administrative Safeguards (§164.308)"
    description: "Ensure business associate arrangements include required safeguards."
    implementation_guidance: "Required. Maintain BAAs with HIPAA security provisions."

  - id: "HIPAA.PS.1"
    title: "Facility Access Controls"
    section: "Physical Safeguards (§164.310)"
    description: "Limit physical access to facilities while ensuring authorized access."
    implementation_guidance: "Required with addressable specs (contingency operations, security plans, access control/validation, maintenance records)."
  - id: "HIPAA.PS.2"
    title: "Workstation Use and Security"
    section: "Physical Safeguards (§164.310)"
    description: "Define proper workstation functions and physical protections."
    implementation_guidance: "Required. Apply physical safeguards to workstations accessing ePHI."
  - id: "HIPAA.PS.3"
    title: "Device and Media Controls"
    section: "Physical Safeguards (§164.310)"
    description: "Govern receipt/removal/reuse/disposal of hardware and media containing ePHI."
    implementation_guidance: "Required with addressable specs for disposal, media reuse, accountability, and data backup/storage."

  - id: "HIPAA.TS.1"
    title: "Access Control"
    section: "Technical Safeguards (§164.312)"
    description: "Implement technical policies/procedures for authorized ePHI access."
    implementation_guidance: "Required with addressable specs for unique user ID, emergency access, automatic logoff, and encryption/decryption."
  - id: "HIPAA.TS.2"
    title: "Audit Controls"
    section: "Technical Safeguards (§164.312)"
    description: "Implement mechanisms to record and examine system activity."
    implementation_guidance: "Required."
  - id: "HIPAA.TS.3"
    title: "Integrity Controls"
    section: "Technical Safeguards (§164.312)"
    description: "Protect ePHI from improper alteration or destruction."
    implementation_guidance: "Required with addressable mechanisms to authenticate ePHI integrity."
  - id: "HIPAA.TS.4"
    title: "Person or Entity Authentication"
    section: "Technical Safeguards (§164.312)"
    description: "Verify a person/entity seeking access to ePHI is who they claim to be."
    implementation_guidance: "Required."
  - id: "HIPAA.TS.5"
    title: "Transmission Security"
    section: "Technical Safeguards (§164.312)"
    description: "Protect ePHI transmitted over electronic networks."
    implementation_guidance: "Required with addressable integrity controls and encryption."
