---
# CMMC Level 2 Framework Configuration
# All 110 practices drawn from NIST SP 800-171 Rev 2.
# Load AFTER iso27001_2022.yaml: python cli.py load-framework config/frameworks/cmmc_level2.yaml
#
# Practice IDs follow CMMC 2.0 convention:
#   [Domain].[Level]-[NIST 800-171 Requirement]
#   L1 = CMMC Level 1 (basic safeguarding, 17 practices)
#   L2 = CMMC Level 2 (advanced, 93 additional practices)
#   Level 2 certification includes ALL 110 (L1 + L2).
#
# maps_to references ISO 27001:2022 Annex A control IDs.
# Assessment target: C3PAO assessment, summer 2026.
# CUI scope: Federal Contract Information (FCI) and Controlled Unclassified Information (CUI)
#   present in Apprio's BOP/government work (AWS GovCloud environment).

framework:
  name: "CMMC Level 2"
  version: "2.0"
  short_name: "cmmc_l2"
  description: "Cybersecurity Maturity Model Certification Level 2 — Advanced Cyber Hygiene. 110 practices aligned to NIST SP 800-171 Rev 2."
  certification_body: "C3PAO (Third-Party Assessment Organization)"
  active: true

controls:

  # =========================================================================
  # DOMAIN: Access Control (AC) — 22 practices
  # =========================================================================

  - id: AC.L1-3.1.1
    title: Authorized Access Control
    domain: Access Control
    owner_default: IT
    review_cadence_days: 180
    evidence_required:
      - type: policy
        description: Access Control Policy limiting system access to authorized users
      - type: report
        description: User access listing — Entra ID, AWS IAM
    maps_to:
      iso27001: [A.5.15, A.5.16, A.8.3]

  - id: AC.L1-3.1.2
    title: Transaction and Function Control
    domain: Access Control
    owner_default: IT
    review_cadence_days: 180
    evidence_required:
      - type: policy
        description: Access Control Policy limiting system access to authorized transactions and functions
      - type: report
        description: Role-based access listing showing function-level restrictions
    maps_to:
      iso27001: [A.5.15, A.8.3]

  - id: AC.L2-3.1.3
    title: Control CUI Flow
    domain: Access Control
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Information Transfer Policy and Data Classification Policy
      - type: config
        description: DLP controls or network segmentation evidence controlling CUI flow
    maps_to:
      iso27001: [A.5.12, A.5.13, A.5.14, A.8.12]

  - id: AC.L2-3.1.4
    title: Separation of Duties
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Segregation of Duties Policy
      - type: report
        description: IAM group/role listing demonstrating duty separation
    maps_to:
      iso27001: [A.5.3]

  - id: AC.L2-3.1.5
    title: Least Privilege
    domain: Access Control
    owner_default: IT
    review_cadence_days: 180
    evidence_required:
      - type: policy
        description: Privileged Access Rights Policy enforcing least privilege
      - type: report
        description: Privileged account audit — AWS IAM and Azure RBAC
    maps_to:
      iso27001: [A.8.2]

  - id: AC.L2-3.1.6
    title: Non-Privileged Account Use
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Privileged Access Rights Policy — separate privileged and non-privileged accounts
      - type: report
        description: Evidence that privileged users have separate accounts for privileged vs. standard tasks
    maps_to:
      iso27001: [A.5.18, A.8.2]

  - id: AC.L2-3.1.7
    title: Privileged Functions
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Acceptable Use Policy — prohibit use of privileged accounts for non-privileged tasks
      - type: log
        description: Privileged account activity log showing appropriate use
    maps_to:
      iso27001: [A.5.10, A.8.2]

  - id: AC.L2-3.1.8
    title: Unsuccessful Logon Attempts
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Account lockout policy configuration (Entra ID / Conditional Access)
      - type: screenshot
        description: Screenshot of lockout threshold settings
    maps_to:
      iso27001: [A.8.5]

  - id: AC.L2-3.1.9
    title: Privacy and Security Notices
    domain: Access Control
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Login banner / system use notification text shown at logon
      - type: screenshot
        description: Screenshot of login banner in production environment
    maps_to:
      iso27001: [A.5.10]

  - id: AC.L2-3.1.10
    title: Session Lock
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Screen lock / session timeout policy (Intune or Group Policy)
      - type: screenshot
        description: Intune compliance policy showing lock timeout requirement
    maps_to:
      iso27001: [A.8.5]

  - id: AC.L2-3.1.11
    title: Session Termination
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Session termination policy for inactive sessions
    maps_to:
      iso27001: [A.8.5]

  - id: AC.L2-3.1.12
    title: Control Remote Access
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Remote Working Policy
      - type: config
        description: VPN or Conditional Access configuration evidence
    maps_to:
      iso27001: [A.6.7]

  - id: AC.L2-3.1.13
    title: Remote Access Confidentiality
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Evidence of encryption in transit for all remote access sessions (TLS/VPN)
    maps_to:
      iso27001: [A.8.24]

  - id: AC.L2-3.1.14
    title: Remote Access Routing
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Network routing configuration showing remote access routes through managed access points
    maps_to:
      iso27001: [A.8.20, A.8.21]

  - id: AC.L2-3.1.15
    title: Privileged Remote Access
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Privileged access workstation or just-in-time access controls for remote privileged sessions
    maps_to:
      iso27001: [A.8.2]

  - id: AC.L2-3.1.16
    title: Wireless Access Authorization
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Wireless access authorization configuration or attestation that no wireless in CUI scope
    maps_to:
      iso27001: [A.8.20]

  - id: AC.L2-3.1.17
    title: Wireless Access Protection
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Wireless encryption and authentication configuration (WPA3 or equivalent)
    maps_to:
      iso27001: [A.8.20, A.8.24]

  - id: AC.L2-3.1.18
    title: Mobile Device Connection
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Intune mobile device management policy and enrollment evidence
      - type: report
        description: Intune device compliance report
    maps_to:
      iso27001: [A.8.1]

  - id: AC.L2-3.1.19
    title: Encrypt CUI on Mobile
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Intune policy enforcing device encryption on mobile devices handling CUI
    maps_to:
      iso27001: [A.8.1, A.8.24]

  - id: AC.L2-3.1.20
    title: External System Connections
    domain: Access Control
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: IS in Supplier Relationships Policy / Cloud Services Policy
      - type: record
        description: Approved external system connection register or supplier review matrix
    maps_to:
      iso27001: [A.5.19, A.5.23]

  - id: AC.L2-3.1.21
    title: Portable Storage Use
    domain: Access Control
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Storage Media Policy restricting portable storage
      - type: config
        description: Intune or endpoint policy blocking or controlling USB/portable storage
    maps_to:
      iso27001: [A.7.10]

  - id: AC.L2-3.1.22
    title: Control Public Information
    domain: Access Control
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Information Classification and Acceptable Use policies
      - type: attestation
        description: Statement confirming CUI is not posted to publicly accessible systems
    maps_to:
      iso27001: [A.5.12, A.5.13]

  # =========================================================================
  # DOMAIN: Awareness and Training (AT) — 3 practices
  # =========================================================================

  - id: AT.L2-3.2.1
    title: Role-Based Risk Awareness
    domain: Awareness and Training
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: IS Awareness, Education and Training Policy
      - type: record
        description: Security awareness training completion report — all active employees
    maps_to:
      iso27001: [A.6.3]

  - id: AT.L2-3.2.2
    title: Role-Based Training
    domain: Awareness and Training
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Role-specific security training records for privileged users and CUI handlers
    maps_to:
      iso27001: [A.6.3]

  - id: AT.L2-3.2.3
    title: Insider Threat Awareness
    domain: Awareness and Training
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Training content or completion records covering insider threat awareness
    maps_to:
      iso27001: [A.6.3]

  # =========================================================================
  # DOMAIN: Audit and Accountability (AU) — 9 practices
  # =========================================================================

  - id: AU.L2-3.3.1
    title: System Auditing
    domain: Audit and Accountability
    owner_default: IT
    review_cadence_days: 90
    evidence_required:
      - type: log
        description: Audit logs enabled across all CUI-scope systems (AWS CloudTrail, Entra ID, Intune, M365)
      - type: policy
        description: Logging Policy
    maps_to:
      iso27001: [A.8.15, A.5.33]

  - id: AU.L2-3.3.2
    title: User Accountability
    domain: Audit and Accountability
    owner_default: IT
    review_cadence_days: 90
    evidence_required:
      - type: log
        description: Audit logs showing individual user actions traceable to specific accounts
    maps_to:
      iso27001: [A.8.15]

  - id: AU.L2-3.3.3
    title: Event Review
    domain: Audit and Accountability
    owner_default: IT
    review_cadence_days: 90
    evidence_required:
      - type: record
        description: Evidence of regular audit log review (Security Hub findings review, SIEM alert review)
    maps_to:
      iso27001: [A.8.16]

  - id: AU.L2-3.3.4
    title: Audit Failure Alerting
    domain: Audit and Accountability
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Alert configuration for audit logging failures or gaps (CloudWatch alarms)
    maps_to:
      iso27001: [A.8.16]

  - id: AU.L2-3.3.5
    title: Audit Correlation
    domain: Audit and Accountability
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: SIEM or log aggregation tool configuration showing cross-source correlation
    maps_to:
      iso27001: [A.8.15, A.8.16]

  - id: AU.L2-3.3.6
    title: Reduction and Reporting
    domain: Audit and Accountability
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Evidence of audit reduction/reporting capability (filtered log exports, dashboards)
    maps_to:
      iso27001: [A.8.16]

  - id: AU.L2-3.3.7
    title: Authoritative Time Source
    domain: Audit and Accountability
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: justification
        description: Clock synchronization evidence — AWS NTP inherited control justification
      - type: policy
        description: Clock Synchronization Policy
    maps_to:
      iso27001: [A.8.17]

  - id: AU.L2-3.3.8
    title: Audit Protection
    domain: Audit and Accountability
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: CloudTrail log file validation and KMS encryption configuration
      - type: screenshot
        description: CloudTrail trails overview showing log integrity validation enabled
    maps_to:
      iso27001: [A.8.15]

  - id: AU.L2-3.3.9
    title: Audit Management
    domain: Audit and Accountability
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Logging Policy defining audit management responsibilities
      - type: record
        description: Evidence of audit log management process (retention, review assignment)
    maps_to:
      iso27001: [A.8.15]

  # =========================================================================
  # DOMAIN: Configuration Management (CM) — 9 practices
  # =========================================================================

  - id: CM.L2-3.4.1
    title: Baseline Configuration
    domain: Configuration Management
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: report
        description: Asset inventory with baseline configuration documentation
      - type: config
        description: AWS Config baseline rules / Intune device compliance baseline
    maps_to:
      iso27001: [A.5.9, A.8.9]

  - id: CM.L2-3.4.2
    title: Security Configuration Enforcement
    domain: Configuration Management
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: screenshot
        description: AWS Config compliance dashboard showing security configuration rules
      - type: config
        description: Intune compliance policies enforcing security baseline
    maps_to:
      iso27001: [A.8.9]

  - id: CM.L2-3.4.3
    title: System Change Control
    domain: Configuration Management
    owner_default: IT
    review_cadence_days: 180
    evidence_required:
      - type: policy
        description: Change Management Policy
      - type: log
        description: Change logs demonstrating controlled change process
    maps_to:
      iso27001: [A.8.32]

  - id: CM.L2-3.4.4
    title: Security Impact Analysis
    domain: Configuration Management
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Change Management Policy including security impact analysis requirement
      - type: record
        description: Sample change record showing security impact assessment step
    maps_to:
      iso27001: [A.8.32]

  - id: CM.L2-3.4.5
    title: Access Restrictions for Change
    domain: Configuration Management
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Access controls limiting who can make system changes (IAM, RBAC)
      - type: policy
        description: Use of Privileged Utility Programs Policy
    maps_to:
      iso27001: [A.8.18]

  - id: CM.L2-3.4.6
    title: Least Functionality
    domain: Configuration Management
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Evidence of unnecessary services/ports/protocols disabled in production
      - type: report
        description: Pen test services scan showing minimal exposed services
    maps_to:
      iso27001: [A.8.31]

  - id: CM.L2-3.4.7
    title: Nonessential Functionality
    domain: Configuration Management
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Application whitelist or configuration showing nonessential components removed
    maps_to:
      iso27001: [A.8.9]

  - id: CM.L2-3.4.8
    title: Application Execution Policy
    domain: Configuration Management
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Installation of Software on Operational Systems Policy
      - type: config
        description: Application control / allowlist configuration evidence
    maps_to:
      iso27001: [A.8.19]

  - id: CM.L2-3.4.9
    title: User-Installed Software
    domain: Configuration Management
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Installation of Software on Operational Systems Policy restricting user installs
      - type: config
        description: Intune or endpoint policy restricting unauthorized software installation
    maps_to:
      iso27001: [A.8.19]

  # =========================================================================
  # DOMAIN: Identification and Authentication (IA) — 11 practices
  # =========================================================================

  - id: IA.L1-3.5.1
    title: Identification
    domain: Identification and Authentication
    owner_default: IT
    review_cadence_days: 180
    evidence_required:
      - type: policy
        description: Identity Management Policy
      - type: report
        description: Entra ID user listing showing unique identified accounts
    maps_to:
      iso27001: [A.5.16]

  - id: IA.L1-3.5.2
    title: Authentication
    domain: Identification and Authentication
    owner_default: IT
    review_cadence_days: 180
    evidence_required:
      - type: config
        description: Authentication configuration — Entra ID Conditional Access policies
      - type: policy
        description: Authentication Information Policy
    maps_to:
      iso27001: [A.5.16, A.5.17]

  - id: IA.L2-3.5.3
    title: Multifactor Authentication
    domain: Identification and Authentication
    owner_default: IT
    review_cadence_days: 90
    evidence_required:
      - type: report
        description: MFA enrollment report showing all CUI-scope users enrolled
      - type: config
        description: Conditional Access policy requiring MFA
      - type: screenshot
        description: Entra ID Conditional Access policies screenshot
    maps_to:
      iso27001: [A.8.5]

  - id: IA.L2-3.5.4
    title: Replay-Resistant Authentication
    domain: Identification and Authentication
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Evidence of replay-resistant auth mechanisms (FIDO2, smart card, or modern auth tokens)
    maps_to:
      iso27001: [A.8.5]

  - id: IA.L2-3.5.5
    title: Identifier Reuse
    domain: Identification and Authentication
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Identity Management Policy prohibiting identifier reuse
      - type: config
        description: Entra ID configuration preventing username reuse for terminated accounts
    maps_to:
      iso27001: [A.5.16]

  - id: IA.L2-3.5.6
    title: Identifier Handling
    domain: Identification and Authentication
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Identity Management Policy covering identifier lifecycle management
      - type: report
        description: Terminated user account status report (Entra ID non-active users)
    maps_to:
      iso27001: [A.5.16, A.6.5]

  - id: IA.L2-3.5.7
    title: Password Complexity
    domain: Identification and Authentication
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Password complexity policy configuration (length, character requirements)
    maps_to:
      iso27001: [A.5.17]

  - id: IA.L2-3.5.8
    title: Password Reuse
    domain: Identification and Authentication
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Password history/reuse policy configuration
    maps_to:
      iso27001: [A.5.17]

  - id: IA.L2-3.5.9
    title: Temporary Passwords
    domain: Identification and Authentication
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Temporary password / initial password change policy configuration
    maps_to:
      iso27001: [A.5.17]

  - id: IA.L2-3.5.10
    title: Cryptographically-Protected Passwords
    domain: Identification and Authentication
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Evidence that passwords are stored using cryptographic hashing (not plaintext)
    maps_to:
      iso27001: [A.5.17, A.8.24]

  - id: IA.L2-3.5.11
    title: Obscure Feedback
    domain: Identification and Authentication
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: Authentication UI configuration obscuring password input feedback
    maps_to:
      iso27001: [A.5.17]

  # =========================================================================
  # DOMAIN: Incident Response (IR) — 3 practices
  # =========================================================================

  - id: IR.L2-3.6.1
    title: Incident Handling
    domain: Incident Response
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: IS Incident Management Plan — covers detection, containment, eradication, recovery
      - type: record
        description: Incident report from current cycle (e.g., IR2026001 phishing incident)
    maps_to:
      iso27001: [A.5.24, A.5.25, A.5.26, A.6.8]

  - id: IR.L2-3.6.2
    title: Incident Reporting
    domain: Incident Response
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: IS Event Reporting Policy and Contact with Authorities Policy
      - type: record
        description: Evidence of incident reporting to relevant authorities (if applicable this cycle)
    maps_to:
      iso27001: [A.5.5, A.5.26, A.5.27, A.6.8]

  - id: IR.L2-3.6.3
    title: Incident Response Testing
    domain: Incident Response
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Tabletop exercise or incident response drill record from current cycle
    maps_to:
      iso27001: [A.5.24]

  # =========================================================================
  # DOMAIN: Maintenance (MA) — 6 practices
  # =========================================================================

  - id: MA.L2-3.7.1
    title: Perform Maintenance
    domain: Maintenance
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Equipment Maintenance Policy
      - type: record
        description: Maintenance records or patch schedules demonstrating controlled maintenance
    maps_to:
      iso27001: [A.7.13]

  - id: MA.L2-3.7.2
    title: System Maintenance Control
    domain: Maintenance
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Equipment Maintenance Policy covering controls on maintenance tools
    maps_to:
      iso27001: [A.7.13, A.7.14]

  - id: MA.L2-3.7.3
    title: Equipment Sanitization
    domain: Maintenance
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Secure Disposal/Re-Use of Equipment Policy
      - type: record
        description: Media sanitization records or certificates of destruction
    maps_to:
      iso27001: [A.7.14]

  - id: MA.L2-3.7.4
    title: Media Inspection
    domain: Maintenance
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Storage Media Policy covering media inspection before use
    maps_to:
      iso27001: [A.7.10]

  - id: MA.L2-3.7.5
    title: Multifactor Authentication for Remote Maintenance
    domain: Maintenance
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: config
        description: MFA enforcement for remote maintenance sessions (verified via Conditional Access)
    maps_to:
      iso27001: [A.8.5]

  - id: MA.L2-3.7.6
    title: Maintenance Personnel
    domain: Maintenance
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Maintenance personnel authorization records or escorted maintenance logs
    maps_to:
      iso27001: [A.7.2, A.7.13]

  # =========================================================================
  # DOMAIN: Media Protection (MP) — 9 practices
  # =========================================================================

  - id: MP.L1-3.8.1
    title: Media Protection
    domain: Media Protection
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Storage Media Policy
    maps_to:
      iso27001: [A.7.10, A.8.10]

  - id: MP.L1-3.8.2
    title: Media Access
    domain: Media Protection
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: policy
