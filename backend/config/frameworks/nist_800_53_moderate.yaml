# NIST SP 800-53 Rev 5 — Moderate Baseline (loaded set)
# 420 controls loaded in this YAML (base controls + enhancements present in file).
# TODO: Reconcile this loaded set against the official NIST SP 800-53B moderate
# baseline / OSCAL export when internet access is available. Do not assume the
# historical "~900" header claim or this file count is authoritative until then.

framework:
  name: "NIST SP 800-53 Rev 5 — Moderate Baseline"
  short_name: "nist_800_53"
  version: "5.0"
  description: >
    NIST Special Publication 800-53 Revision 5 complete Moderate impact
    baseline including all control enhancements. Required for FISMA
    compliance and federal ATO (Authority to Operate). Applicable to
    federal information systems where loss would have serious adverse
    effects on organizational operations, assets, or individuals.
    Relevant for Apprio Inc. as a healthcare-focused federal contractor
    handling PHI under BOP contracts on AWS GovCloud (FedRAMP Moderate).
    Covers 20 control families: AC, AT, AU, CA, CM, CP, IA, IR, MA, MP,
    PE, PL, PS, PT, RA, SA, SC, SI, SR, PM.
  audit_body: "Authorizing Official / Third-Party Assessment Organization (3PAO)"
  applicable_law: "FISMA 2014 (44 U.S.C. § 3551); OMB Circular A-130"
  impact_level: "Moderate"

controls:
  # ═══════════════════════════════════════════════════════════════════════════
  # AC — ACCESS CONTROL
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "AC-1"
    title: "Access Control Policy and Procedures"
    section: "Access Control"
    description: >
      Develop, document, and disseminate an access control policy that
      addresses purpose, scope, roles, responsibilities, management
      commitment, coordination among organizational entities, and
      compliance; and procedures to facilitate the implementation of
      the access control policy and associated access controls.
      Review and update the policy and procedures at defined frequencies.
    implementation_guidance: >
      Evidence: Signed access control policy, access control procedures,
      policy version history, distribution records, annual review evidence.

  - id: "AC-2"
    title: "Account Management"
    section: "Access Control"
    description: >
      Manage system accounts including establishing, activating, modifying,
      reviewing, disabling, and removing accounts. Require approvals for
      creating accounts, monitor for atypical usage, notify managers when
      accounts are no longer required or when users are terminated or
      transferred. Review accounts at defined frequencies.
    implementation_guidance: >
      Evidence: Account provisioning procedures, access request records,
      account review records, termination checklists, Entra ID user
      lifecycle records, user access rights reports.

  - id: "AC-2(1)"
    title: "Account Management — Automated System Account Management"
    section: "Access Control"
    description: >
      Support the management of system accounts using automated mechanisms.
    implementation_guidance: >
      Evidence: Entra ID automated account lifecycle, automated provisioning
      and deprovisioning workflows, identity governance tool records.

  - id: "AC-2(2)"
    title: "Account Management — Automated Temporary and Emergency Account Management"
    section: "Access Control"
    description: >
      Automatically remove or disable temporary and emergency accounts
      after a defined time period.
    implementation_guidance: >
      Evidence: Entra ID access review policies, temporary account expiration
      configuration, emergency account management procedures.

  - id: "AC-2(3)"
    title: "Account Management — Disable Accounts"
    section: "Access Control"
    description: >
      Disable accounts within a defined time period when accounts have
      expired, users are no longer associated with the organization,
      or users have been inactive for a defined period.
    implementation_guidance: >
      Evidence: Account inactivity policy, automated disable configuration,
      Entra ID inactive user reports, offboarding audit logs.

  - id: "AC-2(4)"
    title: "Account Management — Automated Audit Actions"
    section: "Access Control"
    description: >
      Automatically audit account creation, modification, enabling,
      disabling, and removal actions and notify defined personnel.
    implementation_guidance: >
      Evidence: Entra ID audit logs showing account lifecycle events,
      automated notification configuration for account changes.

  - id: "AC-2(5)"
    title: "Account Management — Inactivity Logout"
    section: "Access Control"
    description: >
      Require that users log out when a defined time period of inactivity
      is expected.
    implementation_guidance: >
      Evidence: Session timeout policy, Entra ID sign-in frequency
      configuration, inactivity logout settings.

  - id: "AC-2(7)"
    title: "Account Management — Privileged User Accounts"
    section: "Access Control"
    description: >
      Establish and administer privileged user accounts in accordance
      with a role-based access scheme; monitor privileged role assignments;
      take defined actions when privileged role assignments are no longer
      appropriate.
    implementation_guidance: >
      Evidence: Privileged account inventory, role-based access scheme,
      privileged access reviews, AWS IAM privileged role records.

  - id: "AC-2(11)"
    title: "Account Management — Usage Conditions"
    section: "Access Control"
    description: >
      Enforce defined circumstances and conditions for the use of
      organizational accounts.
    implementation_guidance: >
      Evidence: Entra ID conditional access policies, account usage
      restrictions documentation, terms of use enforcement.

  - id: "AC-2(12)"
    title: "Account Management — Account Monitoring for Atypical Usage"
    section: "Access Control"
    description: >
      Monitor system accounts for atypical usage and report atypical
      usage to defined personnel.
    implementation_guidance: >
      Evidence: User behavior analytics configuration, Security Hub
      findings for anomalous activity, account monitoring alerts.

  - id: "AC-2(13)"
    title: "Account Management — Disable Accounts for High-Risk Individuals"
    section: "Access Control"
    description: >
      Disable accounts of individuals who pose a significant risk within
      a defined time period of discovery of the risk.
    implementation_guidance: >
      Evidence: High-risk user response procedures, account disable
      procedures for terminated or at-risk users, offboarding records.

  - id: "AC-3"
    title: "Access Enforcement"
    section: "Access Control"
    description: >
      Enforce approved authorizations for logical access to information
      and system resources in accordance with applicable access control
      policies.
    implementation_guidance: >
      Evidence: RBAC configuration, access control lists, Entra ID
      conditional access policies, AWS IAM policies, access enforcement
      evidence.

  - id: "AC-3(7)"
    title: "Access Enforcement — Role-Based Access Control"
    section: "Access Control"
    description: >
      Enforce a role-based access control policy over defined subjects
      and objects and control access based upon organization-defined
      roles and users authorized to assume such roles.
    implementation_guidance: >
      Evidence: RBAC policy, role definitions, user-to-role assignments,
      AWS IAM groups and roles, Azure RBAC configuration.

  - id: "AC-4"
    title: "Information Flow Enforcement"
    section: "Access Control"
    description: >
      Enforce approved authorizations for controlling the flow of
      information within the system and between connected systems
      based on organization-defined information flow control policies.
    implementation_guidance: >
      Evidence: Network segmentation documentation, VPC security groups,
      data flow diagrams, firewall rules enforcing flow control.

  - id: "AC-4(4)"
    title: "Information Flow Enforcement — Flow Control of Encrypted Information"
    section: "Access Control"
    description: >
      Prevent encrypted information from bypassing content-checking
      mechanisms by decrypting the information, blocking the flow of
      the information, terminating communications sessions, or initiating
      a request for the information to be delivered in plaintext.
    implementation_guidance: >
      Evidence: TLS inspection configuration, encrypted traffic handling
      policy, network security documentation.

  - id: "AC-5"
    title: "Separation of Duties"
    section: "Access Control"
    description: >
      Separate the duties of individuals as necessary to prevent malevolent
      activity without collusion; document separation of duties of
      individuals; and define system access authorizations to support
      separation of duties.
    implementation_guidance: >
      Evidence: Segregation of duties matrix, role conflict analysis,
      AWS IAM policy structure preventing conflicting access.

  - id: "AC-6"
    title: "Least Privilege"
    section: "Access Control"
    description: >
      Employ the principle of least privilege, allowing only authorized
      accesses for users and processes that are necessary to accomplish
      assigned organizational tasks.
    implementation_guidance: >
      Evidence: Least privilege policy, role definitions, access
      justification records, AWS IAM policy analysis.

  - id: "AC-6(1)"
    title: "Least Privilege — Authorize Access to Security Functions"
    section: "Access Control"
    description: >
      Authorize access for defined individuals or roles to all of the
      following security functions (deployed in hardware, software,
      and firmware) and security-relevant information.
    implementation_guidance: >
      Evidence: Security function access authorization records,
      privileged function access list, admin role assignments.

  - id: "AC-6(2)"
    title: "Least Privilege — Non-Privileged Access for Non-Security Functions"
    section: "Access Control"
    description: >
      Require that users of system accounts, or roles with access to
      defined security functions or security-relevant information, use
      non-privileged accounts or roles when accessing non-security
      functions.
    implementation_guidance: >
      Evidence: Dual-account policy for admins, separate admin and
      standard accounts evidence, privileged access management records.

  - id: "AC-6(5)"
    title: "Least Privilege — Privileged Accounts"
    section: "Access Control"
    description: >
      Restrict privileged accounts on the system to defined personnel
      or roles.
    implementation_guidance: >
      Evidence: Privileged account inventory, admin account restriction
      policy, privileged role assignments, AWS IAM admin users list.

  - id: "AC-6(7)"
    title: "Least Privilege — Review of User Privileges"
    section: "Access Control"
    description: >
      Review the privileges assigned to defined roles or classes of
      users to validate the need for such privileges; and reassign or
      remove privileges, if necessary, to correctly reflect
      organizational mission and business needs.
    implementation_guidance: >
      Evidence: Periodic privilege review records, access review
      completion evidence, user access rights review documentation.

  - id: "AC-6(9)"
    title: "Least Privilege — Log Use of Privileged Functions"
    section: "Access Control"
    description: >
      Log the execution of privileged functions.
    implementation_guidance: >
      Evidence: CloudTrail privileged API logging, Entra ID privileged
      role audit logs, privileged function execution records.

  - id: "AC-6(10)"
    title: "Least Privilege — Prohibit Non-Privileged Users from Executing Privileged Functions"
    section: "Access Control"
    description: >
      Prevent non-privileged users from executing privileged functions
      to include disabling, circumventing, or altering implemented
      security safeguards and countermeasures.
    implementation_guidance: >
      Evidence: Access control enforcement evidence, RBAC preventing
      privilege escalation, admin function restrictions.

  - id: "AC-7"
    title: "Unsuccessful Logon Attempts"
    section: "Access Control"
    description: >
      Enforce a limit of consecutive invalid logon attempts by a user
      during a defined time period; automatically lock the account or
      node for a defined time period when the maximum is exceeded.
    implementation_guidance: >
      Evidence: Account lockout policy configuration, Entra ID
      authentication policies, lockout threshold settings screenshots.

  - id: "AC-8"
    title: "System Use Notification"
    section: "Access Control"
    description: >
      Display an approved system use notification message before granting
      access to the system that provides privacy and security notices.
    implementation_guidance: >
      Evidence: Login banner text and configuration, banner approval
      records, terms of use display evidence.

  - id: "AC-10"
    title: "Concurrent Session Control"
    section: "Access Control"
    description: >
      Limit the number of concurrent sessions for each system account
      and/or account type to a defined number.
    implementation_guidance: >
      Evidence: Concurrent session limit configuration, Entra ID
      session controls, concurrent session policy.

  - id: "AC-11"
    title: "Device Lock"
    section: "Access Control"
    description: >
      Prevent further access by initiating a device lock after a defined
      period of inactivity or upon receiving a request from a user.
    implementation_guidance: >
      Evidence: Intune device compliance policies, screen lock
      configuration, device lock policy settings.

  - id: "AC-11(1)"
    title: "Device Lock — Pattern-Hiding Displays"
    section: "Access Control"
    description: >
      Conceal, via the device lock, information previously visible on
      the display with a publicly viewable image.
    implementation_guidance: >
      Evidence: Screen lock display configuration, blank screen or
      pattern lock settings evidence.

  - id: "AC-12"
    title: "Session Termination"
    section: "Access Control"
    description: >
      Automatically terminate a user session after a defined condition.
    implementation_guidance: >
      Evidence: Session timeout configuration, Entra ID sign-in
      frequency policies, automatic session termination evidence.

  - id: "AC-12(1)"
    title: "Session Termination — User-Initiated Logouts"
    section: "Access Control"
    description: >
      Provide a logout capability for user-initiated communications
      sessions whenever authentication is used to gain access to
      information resources.
    implementation_guidance: >
      Evidence: Logout functionality evidence in applications,
      user session termination capability documentation.

  - id: "AC-14"
    title: "Permitted Actions Without Identification or Authentication"
    section: "Access Control"
    description: >
      Identify and document user actions that can be performed on the
      system without identification or authentication consistent with
      organizational mission and business functions.
    implementation_guidance: >
      Evidence: Documented permitted unauthenticated actions,
      public-facing system access documentation.

  - id: "AC-17"
    title: "Remote Access"
    section: "Access Control"
    description: >
      Establish and document usage restrictions, configuration and
      connection requirements, and implementation guidance for each
      type of remote access; authorize each type of remote access
      prior to allowing such connections.
    implementation_guidance: >
      Evidence: Remote access policy, VPN configuration, remote
      working policy, authorized remote access methods documentation.

  - id: "AC-17(1)"
    title: "Remote Access — Monitoring and Control"
    section: "Access Control"
    description: >
      Employ automated mechanisms to monitor and control remote
      access methods.
    implementation_guidance: >
      Evidence: Entra ID sign-in logs, remote access monitoring,
      VPN usage reports, conditional access monitoring.

  - id: "AC-17(2)"
    title: "Remote Access — Protection of Confidentiality and Integrity Using Encryption"
    section: "Access Control"
    description: >
      Implement cryptographic mechanisms to protect the confidentiality
      and integrity of remote access sessions.
    implementation_guidance: >
      Evidence: VPN encryption configuration, TLS for remote access,
      encryption standards for remote sessions.

  - id: "AC-17(3)"
    title: "Remote Access — Managed Access Control Points"
    section: "Access Control"
    description: >
      Route remote accesses via managed network access control points.
    implementation_guidance: >
      Evidence: VPN gateway configuration, managed access point
      documentation, network topology showing controlled entry points.

  - id: "AC-17(4)"
    title: "Remote Access — Privileged Commands and Access"
    section: "Access Control"
    description: >
      Authorize the execution of privileged commands and access to
      security-relevant information via remote access only in
      operational needs documented in the security plan.
    implementation_guidance: >
      Evidence: Privileged remote access authorization records,
      jump server or PAM tool configuration, remote admin procedures.

  - id: "AC-18"
    title: "Wireless Access"
    section: "Access Control"
    description: >
      Establish configuration requirements, connection requirements,
      and implementation guidance for wireless access; authorize
      wireless access to the system.
    implementation_guidance: >
      Evidence: Wireless access policy, Wi-Fi security configuration,
      authorized wireless access documentation.

  - id: "AC-18(1)"
    title: "Wireless Access — Authentication and Encryption"
    section: "Access Control"
    description: >
      Protect wireless access to the system using authentication of
      users and devices and encryption.
    implementation_guidance: >
      Evidence: WPA3 or WPA2-Enterprise configuration, wireless
      authentication configuration, certificate-based wireless auth.

  - id: "AC-19"
    title: "Access Control for Mobile Devices"
    section: "Access Control"
    description: >
      Establish configuration requirements, connection requirements,
      and implementation guidance for organization-controlled mobile
      devices; authorize connection of mobile devices to organizational
      systems.
    implementation_guidance: >
      Evidence: Mobile device policy, Intune MDM enrollment records,
      device compliance policies, mobile device authorization records.

  - id: "AC-19(5)"
    title: "Access Control for Mobile Devices — Full Device or Container-Based Encryption"
    section: "Access Control"
    description: >
      Employ full-device encryption or container-based encryption to
      protect data on mobile devices.
    implementation_guidance: >
      Evidence: Intune device encryption requirement configuration,
      BitLocker or FileVault enforcement, device encryption compliance
      reports.

  - id: "AC-20"
    title: "Use of External Systems"
    section: "Access Control"
    description: >
      Establish terms and conditions for authorized individuals to
      access the system from external systems; permit only authorized
      use of external systems.
    implementation_guidance: >
      Evidence: External system access policy, acceptable use policy,
      terms and conditions for external access.

  - id: "AC-20(1)"
    title: "Use of External Systems — Limits on Authorized Use"
    section: "Access Control"
    description: >
      Permit authorized individuals to use an external system to access
      the system or to process, store, or transmit organization-controlled
      information only after verification of the implementation of
      required controls on the external system.
    implementation_guidance: >
      Evidence: External system verification procedures, BYOD policy,
      external system compliance requirements.

  - id: "AC-20(2)"
    title: "Use of External Systems — Portable Storage Devices — Restricted Use"
    section: "Access Control"
    description: >
      Restrict or prohibit the use of portable storage devices by
      authorized individuals on external systems.
    implementation_guidance: >
      Evidence: Removable media policy, USB restriction configuration
      in Intune, portable storage device restrictions.

  - id: "AC-21"
    title: "Information Sharing"
    section: "Access Control"
    description: >
      Enable authorized users to determine whether access authorizations
      assigned to a sharing partner match the access restrictions on
      information for defined information sharing circumstances; facilitate
      information sharing decisions by authorized users.
    implementation_guidance: >
      Evidence: Information sharing policy, data classification and
      sharing procedures, information transfer agreements.

  - id: "AC-22"
    title: "Publicly Accessible Content"
    section: "Access Control"
    description: >
      Designate individuals authorized to post information publicly;
      train individuals to ensure public information does not contain
      nonpublic information; review content before posting; review
      posted content periodically.
    implementation_guidance: >
      Evidence: Public content policy, designated approver records,
      content review procedures, public-facing system documentation.

  # ═══════════════════════════════════════════════════════════════════════════
  # AT — AWARENESS AND TRAINING
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "AT-1"
    title: "Awareness and Training Policy and Procedures"
    section: "Awareness and Training"
    description: >
      Develop, document, and disseminate security and privacy awareness
      and training policy and procedures; review and update at defined
      frequencies.
    implementation_guidance: >
      Evidence: Security awareness and training policy, training
      procedures, policy review records.

  - id: "AT-2"
    title: "Literacy Training and Awareness"
    section: "Awareness and Training"
    description: >
      Provide security and privacy literacy training to system users
      as part of initial training for new users and when required by
      system changes; update training content annually; incorporate
      lessons learned from internal or external security incidents.
    implementation_guidance: >
      Evidence: Security awareness training completion records,
      training curriculum, annual training documentation, new hire
      training records.

  - id: "AT-2(2)"
    title: "Literacy Training and Awareness — Insider Threat"
    section: "Awareness and Training"
    description: >
      Provide literacy training on recognizing and reporting potential
      indicators of insider threat.
    implementation_guidance: >
      Evidence: Insider threat awareness training materials and
      completion records, insider threat program documentation.

  - id: "AT-2(3)"
    title: "Literacy Training and Awareness — Social Engineering and Mining"
    section: "Awareness and Training"
    description: >
      Provide literacy training on recognizing and reporting potential
      and actual instances of social engineering and social mining.
    implementation_guidance: >
      Evidence: Anti-phishing and social engineering training records,
      phishing simulation results, security awareness curriculum
      covering social engineering.

  - id: "AT-3"
    title: "Role-Based Training"
    section: "Awareness and Training"
    description: >
      Provide role-based security and privacy training to personnel with
      assigned security and privacy roles and responsibilities before
      authorizing access, when required by system changes, and annually.
    implementation_guidance: >
      Evidence: Role-based training curriculum, completion records
      by role, training schedule, records for privileged users and
      security personnel.

  - id: "AT-3(5)"
    title: "Role-Based Training — Processing Personally Identifiable Information"
    section: "Awareness and Training"
    description: >
      Provide training to personnel on the authorized processing of
      personally identifiable information and on the consequences of
      unauthorized processing.
    implementation_guidance: >
      Evidence: PII handling training materials, training completion
      records for personnel handling PHI/PII, HIPAA training records.

  - id: "AT-4"
    title: "Training Records"
    section: "Awareness and Training"
    description: >
      Document and monitor information security and privacy training
      activities; retain training records for a defined time period.
    implementation_guidance: >
      Evidence: Training completion logs, training tracking records,
      training gap reports, retention documentation.

  # ═══════════════════════════════════════════════════════════════════════════
  # AU — AUDIT AND ACCOUNTABILITY
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "AU-1"
    title: "Audit and Accountability Policy and Procedures"
    section: "Audit and Accountability"
    description: >
      Develop, document, and disseminate an audit and accountability
      policy and procedures; review and update at defined frequencies.
    implementation_guidance: >
      Evidence: Audit and accountability policy, logging procedures,
      policy review records.

  - id: "AU-2"
    title: "Event Logging"
    section: "Audit and Accountability"
    description: >
      Identify the types of events that the system is capable of logging;
      coordinate the event logging function with other organizations;
      specify event types for logging within the system.
    implementation_guidance: >
      Evidence: Logging policy defining event types, CloudTrail
      configuration, Entra ID audit log settings, log coverage matrix.

  - id: "AU-3"
    title: "Content of Audit Records"
    section: "Audit and Accountability"
    description: >
      Ensure that audit records contain information establishing what
      type of event occurred, when, where, the source, the outcome,
      and the identity of individuals associated with the event.
    implementation_guidance: >
      Evidence: Sample audit log records showing required fields,
      log format documentation.

  - id: "AU-3(1)"
    title: "Content of Audit Records — Additional Audit Information"
    section: "Audit and Accountability"
    description: >
      Generate audit records containing the following additional
      information: defined additional information.
    implementation_guidance: >
      Evidence: Enhanced audit log configuration, log fields showing
      additional required information, log format documentation.

  - id: "AU-4"
    title: "Audit Log Storage Capacity"
    section: "Audit and Accountability"
    description: >
      Allocate audit log storage capacity to accommodate the audit log
      retention requirements; take action when storage capacity is threatened.
    implementation_guidance: >
      Evidence: Log storage configuration, CloudWatch capacity alarms,
      S3 storage capacity for logs, storage planning records.

  - id: "AU-5"
    title: "Response to Audit Logging Process Failures"
    section: "Audit and Accountability"
    description: >
      Alert designated personnel within a defined time period in the
      event of an audit logging process failure; take actions upon failure.
    implementation_guidance: >
      Evidence: Alerting for log failures, CloudWatch alarms,
      incident response for logging failures.

  - id: "AU-5(1)"
    title: "Response to Audit Logging Process Failures — Storage Capacity Warning"
    section: "Audit and Accountability"
    description: >
      Provide a warning to defined personnel within a defined time period
      when allocated audit log storage volume reaches a defined percentage
      of maximum audit log storage capacity.
    implementation_guidance: >
      Evidence: Storage capacity warning alerts, CloudWatch storage
      threshold alarms, log storage monitoring configuration.

  - id: "AU-6"
    title: "Audit Record Review, Analysis, and Reporting"
    section: "Audit and Accountability"
    description: >
      Review and analyze system audit records at a defined frequency
      for indications of inappropriate or unusual activity; report
      findings to defined personnel; adjust the level of review based
      on risk.
    implementation_guidance: >
      Evidence: Log review procedures, Security Hub findings, CrowdStrike
      monitoring records, log review reports.

  - id: "AU-6(1)"
    title: "Audit Record Review, Analysis, and Reporting — Automated Process Integration"
    section: "Audit and Accountability"
    description: >
      Integrate audit record review, analysis, and reporting processes
      using automated mechanisms.
    implementation_guidance: >
      Evidence: SIEM integration, Security Hub automated analysis,
      automated log analysis tools configuration.

  - id: "AU-6(3)"
    title: "Audit Record Review, Analysis, and Reporting — Correlate Audit Record Repositories"
    section: "Audit and Accountability"
    description: >
      Analyze and correlate audit records across different repositories
      to gain organization-wide situational awareness.
    implementation_guidance: >
      Evidence: Cross-system log correlation configuration, centralized
      logging architecture, unified audit log analysis.

  - id: "AU-7"
    title: "Audit Record Reduction and Report Generation"
    section: "Audit and Accountability"
    description: >
      Provide an audit record reduction and report generation capability
      that supports on-demand analysis and reporting and does not alter
      original content or time ordering.
    implementation_guidance: >
      Evidence: Log management tool documentation, CloudWatch Logs
      Insights, log analysis and reporting capability evidence.

  - id: "AU-7(1)"
    title: "Audit Record Reduction and Report Generation — Automatic Sort and Search"
    section: "Audit and Accountability"
    description: >
      Provide the capability to process audit records for events of
      interest based on defined fields within audit records.
    implementation_guidance: >
      Evidence: Log search and filtering capability, CloudWatch Logs
      query features, log analysis tool configuration.

  - id: "AU-8"
    title: "Time Stamps"
    section: "Audit and Accountability"
    description: >
      Use internal system clocks to generate time stamps for audit
      records; record time stamps that meet granularity of one second
      or finer and map to UTC or GMT.
    implementation_guidance: >
      Evidence: NTP configuration, AWS time synchronization,
      clock synchronization policy, time stamp format evidence.

  - id: "AU-9"
    title: "Protection of Audit Information"
    section: "Audit and Accountability"
    description: >
      Protect audit information and audit tools from unauthorized access,
      modification, and deletion.
    implementation_guidance: >
      Evidence: CloudTrail log file integrity validation, S3 bucket
      policies protecting logs, access controls on audit systems.

  - id: "AU-9(4)"
    title: "Protection of Audit Information — Access by Subset of Privileged Users"
    section: "Audit and Accountability"
    description: >
      Authorize access to management of audit logging functionality
      only to a defined subset of privileged users or roles.
    implementation_guidance: >
      Evidence: Audit log access control configuration, restricted
      admin access to logging systems, audit log management permissions.

  - id: "AU-10"
    title: "Non-Repudiation"
    section: "Audit and Accountability"
    description: >
      Provide irrefutable evidence that an individual or process took
      a specific action. Protect against an individual or entity
      falsely denying having performed a specific action.
    implementation_guidance: >
      Evidence: Digital signature configuration, non-repudiation
      policy, audit trail integrity mechanisms.

  - id: "AU-11"
    title: "Audit Record Retention"
    section: "Audit and Accountability"
    description: >
      Retain audit records for a defined time period to provide support
      for after-the-fact investigations of security incidents.
    implementation_guidance: >
      Evidence: Log retention policy, CloudTrail retention settings,
      S3 lifecycle policies for log retention, retention period evidence.

  - id: "AU-12"
    title: "Audit Record Generation"
    section: "Audit and Accountability"
    description: >
      Provide audit record generation capability for defined event types;
      allow designated personnel to select event types; generate audit
      records for defined events.
    implementation_guidance: >
      Evidence: CloudTrail configuration for management and data events,
      Entra ID audit log settings, logging configuration documentation.

  - id: "AU-12(1)"
    title: "Audit Record Generation — System-Wide Audit Trail"
    section: "Audit and Accountability"
    description: >
      Compile audit records from defined system components into a
      system-wide (logical or physical) audit trail that is time-correlated
      to within a defined level of tolerance.
    implementation_guidance: >
      Evidence: Centralized logging architecture, log aggregation
      configuration, time correlation evidence across systems.

  - id: "AU-12(3)"
    title: "Audit Record Generation — Changes by Authorized Individuals"
    section: "Audit and Accountability"
    description: >
      Provide and implement the capability for defined individuals or
      roles to change the logging to be performed on system components
      based on defined selectable event criteria within defined time
      thresholds.
    implementation_guidance: >
      Evidence: Authorized individuals for logging changes, logging
      change procedures, audit of logging configuration changes.

  # ═══════════════════════════════════════════════════════════════════════════
  # CA — ASSESSMENT, AUTHORIZATION, AND MONITORING
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "CA-1"
    title: "Assessment, Authorization, and Monitoring Policy and Procedures"
    section: "Assessment Authorization and Monitoring"
    description: >
      Develop, document, and disseminate policy and procedures for
      assessment, authorization, and monitoring of security and privacy
      controls; review and update at defined frequencies.
    implementation_guidance: >
      Evidence: CA policy, authorization process documentation,
      continuous monitoring policy, policy review records.

  - id: "CA-2"
    title: "Control Assessments"
    section: "Assessment Authorization and Monitoring"
    description: >
      Select appropriate assessors; develop a security and privacy
      assessment plan; assess controls to determine extent to which
      they are implemented correctly, operating as intended, and
      producing desired outcomes; produce assessment reports.
    implementation_guidance: >
      Evidence: Assessment plan, assessment results, internal audit
      reports, third-party assessment results, corrective action plans.

  - id: "CA-2(2)"
    title: "Control Assessments — Specialized Assessments"
    section: "Assessment Authorization and Monitoring"
    description: >
      Include as part of control assessments specialized assessments
      using defined forms of testing such as red team exercises,
      penetration testing, or independent verification.
    implementation_guidance: >
      Evidence: Penetration test report, red team exercise records,
      specialized assessment results, independent verification records.

  - id: "CA-3"
    title: "Information Exchange"
    section: "Assessment Authorization and Monitoring"
    description: >
      Approve and manage the exchange of information between the system
      and other systems using information exchange agreements; document
      interface characteristics, security requirements, and nature of
      information communicated.
    implementation_guidance: >
      Evidence: System interconnection agreements, data sharing
      agreements, API security documentation, BOP connection agreements.

  - id: "CA-3(6)"
    title: "Information Exchange — Transfer Authorizations"
    section: "Assessment Authorization and Monitoring"
    description: >
      Verify that individuals or systems transferring data between
      interconnecting systems have the requisite authorizations.
    implementation_guidance: >
      Evidence: Transfer authorization procedures, data transfer
      approval records, interconnection authorization documentation.

  - id: "CA-5"
    title: "Plan of Action and Milestones"
    section: "Assessment Authorization and Monitoring"
    description: >
      Develop a plan of action and milestones to document planned
      remediation actions to correct weaknesses noted during assessment
      of controls and to reduce or eliminate known vulnerabilities.
    implementation_guidance: >
      Evidence: POA&M document with findings, remediation timelines,
      milestone tracking, corrective action records.

  - id: "CA-6"
    title: "Authorization"
    section: "Assessment Authorization and Monitoring"
    description: >
      Assign a senior official as the authorizing official; ensure
      the authorizing official authorizes the system before commencing
      operations; update the authorization when required.
    implementation_guidance: >
      Evidence: ATO letter, authorizing official designation,
      authorization boundary documentation, system authorization package.

  - id: "CA-7"
    title: "Continuous Monitoring"
    section: "Assessment Authorization and Monitoring"
    description: >
      Develop a continuous monitoring strategy; implement continuous
      monitoring; assess security and privacy controls; conduct ongoing
      awareness training; report security and privacy status to the
      authorizing official.
    implementation_guidance: >
      Evidence: Continuous monitoring plan, Security Hub dashboard,
      CrowdStrike monitoring, monthly security status reports.

  - id: "CA-7(1)"
    title: "Continuous Monitoring — Independent Assessment"
    section: "Assessment Authorization and Monitoring"
    description: >
      Employ assessors or assessment teams with defined independence to
      monitor the security and privacy controls in the system on an
      ongoing basis.
    implementation_guidance: >
      Evidence: Independent assessor records, third-party monitoring
      engagement, assessment team independence documentation.

  - id: "CA-7(4)"
    title: "Continuous Monitoring — Risk Monitoring"
    section: "Assessment Authorization and Monitoring"
    description: >
      Ensure risk monitoring is an integral part of the continuous
      monitoring strategy that includes the following: effectiveness
      monitoring; compliance monitoring; change monitoring.
    implementation_guidance: >
      Evidence: Risk monitoring procedures, continuous monitoring
      metrics, risk monitoring reports.

  - id: "CA-8"
    title: "Penetration Testing"
    section: "Assessment Authorization and Monitoring"
    description: >
      Conduct penetration testing on the system or system components
      at a defined frequency.
    implementation_guidance: >
      Evidence: Penetration test report, pen test scope and methodology,
      remediation tracking for findings.

  - id: "CA-8(1)"
    title: "Penetration Testing — Independent Penetration Testing Agent or Team"
    section: "Assessment Authorization and Monitoring"
    description: >
      Employ an independent penetration testing agent or team to perform
      penetration testing on the system or system components.
    implementation_guidance: >
      Evidence: Third-party penetration test report, independent pen
      test provider engagement records.

  - id: "CA-9"
    title: "Internal System Connections"
    section: "Assessment Authorization and Monitoring"
    description: >
      Authorize internal connections of system components to the system;
      document interface characteristics, security requirements, and
      nature of information communicated for internal connections.
    implementation_guidance: >
      Evidence: Internal connection authorization records, system
      architecture diagram, VPC configuration documentation.

  # ═══════════════════════════════════════════════════════════════════════════
  # CM — CONFIGURATION MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "CM-1"
    title: "Configuration Management Policy and Procedures"
    section: "Configuration Management"
    description: >
      Develop, document, and disseminate a configuration management
      policy and procedures; review and update at defined frequencies.
    implementation_guidance: >
      Evidence: Configuration management policy, CM procedures,
      policy review records.

  - id: "CM-2"
    title: "Baseline Configuration"
    section: "Configuration Management"
    description: >
      Develop, document, and maintain a current baseline configuration
      of the system; review and update the baseline configuration at
      defined frequencies and when required due to system changes.
    implementation_guidance: >
      Evidence: System baseline configuration documentation, AWS Config
      compliance dashboard, Intune baseline policy records.

  - id: "CM-2(2)"
    title: "Baseline Configuration — Automation Support for Accuracy and Currency"
    section: "Configuration Management"
    description: >
      Maintain the currency, completeness, accuracy, and ready availability
      of the baseline configuration through automated mechanisms.
    implementation_guidance: >
      Evidence: AWS Config automated configuration tracking, automated
      baseline configuration management tools, configuration automation
      evidence.

  - id: "CM-2(7)"
    title: "Baseline Configuration — Configure Systems and Components for High-Risk Areas"
    section: "Configuration Management"
    description: >
      Issue systems or system components with defined configurations
      to individuals traveling to locations deemed high-risk; apply
      additional security safeguards upon return.
    implementation_guidance: >
      Evidence: High-risk travel device policy, travel device
      configuration procedures, post-travel security procedures.

  - id: "CM-3"
    title: "Configuration Change Control"
    section: "Configuration Management"
    description: >
      Determine types of changes that are configuration-controlled;
      review proposed changes; approve or disapprove; document
      configuration change decisions; implement approved changes;
      retain records of changes.
    implementation_guidance: >
      Evidence: Change management policy, change request records,
      Azure DevOps activity logs, change approval documentation.

  - id: "CM-3(2)"
    title: "Configuration Change Control — Testing, Validation, and Documentation"
    section: "Configuration Management"
    description: >
      Test, validate, and document changes to the system before
      finalizing the implementation of the changes.
    implementation_guidance: >
      Evidence: Change testing procedures, test environment evidence,
      test results documentation before production deployment.

  - id: "CM-4"
    title: "Impact Analyses"
    section: "Configuration Management"
    description: >
      Analyze changes to the system to determine potential security
      and privacy impacts prior to change implementation.
    implementation_guidance: >
      Evidence: Change impact assessment procedures, security review
      records for changes, impact analysis documentation.

  - id: "CM-4(2)"
    title: "Impact Analyses — Verification of Security and Privacy Functions"
    section: "Configuration Management"
    description: >
      After system changes, verify that the impacted security and
      privacy functions still operate correctly.
    implementation_guidance: >
      Evidence: Post-change security function verification procedures,
      test results confirming security function integrity after changes.

  - id: "CM-5"
    title: "Access Restrictions for Change"
    section: "Configuration Management"
    description: >
      Define, document, approve, and enforce physical and logical access
      restrictions associated with changes to the system.
    implementation_guidance: >
      Evidence: Change access restrictions, production access controls,
      deployment pipeline access controls, change authority records.

  - id: "CM-6"
    title: "Configuration Settings"
    section: "Configuration Management"
    description: >
      Establish and document configuration settings reflecting the most
      restrictive mode consistent with operational requirements;
      implement the configuration settings; identify deviations.
    implementation_guidance: >
      Evidence: CIS benchmark configurations, AWS Config rules,
      Intune compliance policies, security baseline documentation.

  - id: "CM-6(1)"
    title: "Configuration Settings — Automated Management, Application, and Verification"
    section: "Configuration Management"
    description: >
      Manage, apply, and verify configuration settings using automated
      mechanisms.
    implementation_guidance: >
      Evidence: AWS Config automated rules, Intune automated policy
      enforcement, configuration management automation evidence.

  - id: "CM-7"
    title: "Least Functionality"
    section: "Configuration Management"
    description: >
      Configure the system to provide only essential capabilities;
      prohibit or restrict the use of functions, ports, protocols,
      software, and services not required.
    implementation_guidance: >
      Evidence: Port and protocol restrictions, software allowlist,
      firewall rules, SonicWall configuration, service hardening records.

  - id: "CM-7(1)"
    title: "Least Functionality — Periodic Review"
    section: "Configuration Management"
    description: >
      Review the system at a defined frequency to identify unnecessary
      or nonsecure functions, ports, protocols, software, and services
      and disable or remove them.
    implementation_guidance: >
      Evidence: Periodic review records of enabled services, port
      scanning results, service inventory review documentation.

  - id: "CM-7(2)"
    title: "Least Functionality — Prevent Use of Programs Executing in Higher Privilege Modes"
    section: "Configuration Management"
    description: >
      Prevent the use of programs executing at higher privilege levels
      than users executing those programs.
    implementation_guidance: >
      Evidence: Application privilege controls, UAC configuration,
      application whitelisting preventing privilege escalation.

  - id: "CM-7(5)"
    title: "Least Functionality — Authorized Software"
    section: "Configuration Management"
    description: >
      Identify authorized software and employ a deny-all, permit-by-exception
      policy to allow the execution of authorized software.
    implementation_guidance: >
      Evidence: Software whitelist/allowlist, application control
      configuration, authorized software inventory, Intune app policy.

  - id: "CM-8"
    title: "System Component Inventory"
    section: "Configuration Management"
    description: >
      Develop and document an inventory of system components that
      accurately reflects the system; is consistent with the authorization
      boundary; is at the level of granularity necessary for tracking
      and reporting.
    implementation_guidance: >
      Evidence: Asset inventory register, NinjaOne device inventory,
      CrowdStrike host inventory, AWS resource inventory.

  - id: "CM-8(1)"
    title: "System Component Inventory — Updates During Installation and Removal"
    section: "Configuration Management"
    description: >
      Update the inventory of system components as part of component
      installations, removals, and system updates.
    implementation_guidance: >
      Evidence: Inventory update procedures, automated inventory
      update evidence, component installation/removal records.

  - id: "CM-8(3)"
    title: "System Component Inventory — Automated Unauthorized Component Detection"
    section: "Configuration Management"
    description: >
      Detect the presence of unauthorized hardware, software, and
      firmware components within the system using automated mechanisms
      at a defined frequency.
    implementation_guidance: >
      Evidence: NinjaOne unauthorized device detection, CrowdStrike
      device discovery, automated inventory scanning evidence.

  - id: "CM-9"
    title: "Configuration Management Plan"
    section: "Configuration Management"
    description: >
      Develop, document, and implement a configuration management plan
      that addresses roles, responsibilities, and configuration
      management processes and procedures.
    implementation_guidance: >
      Evidence: Configuration management plan document, CM roles and
      responsibilities documentation.

  - id: "CM-10"
    title: "Software Usage Restrictions"
    section: "Configuration Management"
    description: >
      Use software in accordance with contract agreements and copyright
      laws; track use of software under quantity licenses; control
      peer-to-peer file sharing technology.
    implementation_guidance: >
      Evidence: Software license tracking, acceptable use policy,
      software inventory with license records.

  - id: "CM-11"
    title: "User-Installed Software"
    section: "Configuration Management"
    description: >
      Establish policies governing installation of software by users;
      enforce software installation policies; monitor policy compliance.
    implementation_guidance: >
      Evidence: User software installation policy, Intune application
      management configuration, compliance monitoring records.

  - id: "CM-11(3)"
    title: "User-Installed Software — Automated Enforcement and Monitoring"
    section: "Configuration Management"
    description: >
      Enforce and monitor compliance with software installation policies
      using automated mechanisms.
    implementation_guidance: >
      Evidence: Intune automated app policy enforcement, software
      installation monitoring, automated compliance reporting.

  - id: "CM-12"
    title: "Information Location"
    section: "Configuration Management"
    description: >
      Identify and document the location of defined information and
      the specific system components on which the information is
      processed and stored; identify and document the users with access.
    implementation_guidance: >
      Evidence: Data inventory, system component documentation showing
      data locations, data flow diagrams.

  - id: "CM-13"
    title: "Data Action Mapping"
    section: "Configuration Management"
    description: >
      Develop and document a map of system data actions.
    implementation_guidance: >
      Evidence: Data action mapping documentation, data processing
      records, system use case documentation.

  - id: "CM-14"
    title: "Signed Components"
    section: "Configuration Management"
    description: >
      Prevent the installation of defined software components without
      verification that the component has been digitally signed using
      a certificate recognized and approved by the organization.
    implementation_guidance: >
      Evidence: Code signing policy, signed software verification
      procedures, certificate approval records.

  # ═══════════════════════════════════════════════════════════════════════════
  # CP — CONTINGENCY PLANNING
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "CP-1"
    title: "Contingency Planning Policy and Procedures"
    section: "Contingency Planning"
    description: >
      Develop, document, and disseminate a contingency planning policy
      and procedures; review and update at defined frequencies.
    implementation_guidance: >
      Evidence: Contingency planning policy, BCP/DR procedures,
      policy review records.

  - id: "CP-2"
    title: "Contingency Plan"
    section: "Contingency Planning"
    description: >
      Develop a contingency plan identifying essential missions and
      business functions; providing recovery objectives, restoration
      priorities, and metrics; addressing contingency roles and
      responsibilities; addressing maintaining essential functions
      despite disruption.
    implementation_guidance: >
      Evidence: Business continuity plan, disaster recovery plan,
      ICT readiness documentation.

  - id: "CP-2(1)"
    title: "Contingency Plan — Coordinate with Related Plans"
    section: "Contingency Planning"
    description: >
      Coordinate contingency plan development with organizational
      elements responsible for related plans.
    implementation_guidance: >
      Evidence: Coordination records between BCP and related plans,
      integrated planning documentation.

  - id: "CP-2(2)"
    title: "Contingency Plan — Capacity Planning"
    section: "Contingency Planning"
    description: >
      Conduct capacity planning so that necessary capacity for
      information processing, telecommunications, and environmental
      support exists during contingency operations.
    implementation_guidance: >
      Evidence: Capacity planning documentation, contingency
      resource requirements, infrastructure capacity assessment.

  - id: "CP-2(3)"
    title: "Contingency Plan — Resume Mission and Business Functions"
    section: "Contingency Planning"
    description: >
      Plan for the resumption of defined mission-essential functions
      within a defined time period of contingency plan activation.
    implementation_guidance: >
      Evidence: Mission-essential function list, RTO documentation,
      resumption procedures with time objectives.

  - id: "CP-2(5)"
    title: "Contingency Plan — Continue Mission and Business Functions"
    section: "Contingency Planning"
    description: >
      Plan for the continuance of defined mission-essential functions
      with minimal or no loss of operational continuity.
    implementation_guidance: >
      Evidence: Continuity of operations procedures, hot/warm/cold
      site arrangements, operational continuity documentation.

  - id: "CP-2(8)"
    title: "Contingency Plan — Identify Critical Assets"
    section: "Contingency Planning"
    description: >
      Identify critical system assets supporting essential mission and
      business functions.
    implementation_guidance: >
      Evidence: Critical asset identification records, asset
      criticality ratings, essential function to asset mapping.

  - id: "CP-3"
    title: "Contingency Training"
    section: "Contingency Planning"
    description: >
      Provide contingency training to system users consistent with
      assigned roles within a defined time period; annually thereafter.
    implementation_guidance: >
      Evidence: Contingency training records, tabletop exercise
      participation records, training schedule.

  - id: "CP-3(1)"
    title: "Contingency Training — Simulated Events"
    section: "Contingency Planning"
    description: >
      Incorporate simulated events into contingency training to
      facilitate effective response by personnel in crisis situations.
    implementation_guidance: >
      Evidence: Tabletop exercise records, simulated contingency
      event training documentation.

  - id: "CP-4"
    title: "Contingency Plan Testing"
    section: "Contingency Planning"
    description: >
      Test the contingency plan at a defined frequency; review test
      results; initiate corrective actions if needed.
    implementation_guidance: >
      Evidence: BCP test records, DR test results, tabletop exercise
      after-action reports, EBS snapshot restore validation.

  - id: "CP-4(1)"
    title: "Contingency Plan Testing — Coordinate with Related Plans"
    section: "Contingency Planning"
    description: >
      Coordinate contingency plan testing with organizational elements
      responsible for related plans.
    implementation_guidance: >
      Evidence: Coordinated testing records, multi-plan exercise
      documentation.

  - id: "CP-4(2)"
    title: "Contingency Plan Testing — Alternate Processing Site"
    section: "Contingency Planning"
    description: >
      Test the contingency plan at an alternate processing site to
      familiarize contingency personnel with the facility and
      available resources, and to evaluate capabilities.
    implementation_guidance: >
      Evidence: Alternate site testing records, AWS alternate region
      failover test results.

  - id: "CP-6"
    title: "Alternate Storage Site"
    section: "Contingency Planning"
    description: >
      Establish an alternate storage site with necessary agreements
      to permit storage and retrieval of system backup information;
      ensure the alternate site provides equivalent security controls.
    implementation_guidance: >
      Evidence: AWS S3 cross-region replication configuration,
      backup storage documentation, RTO/RPO definitions.

  - id: "CP-6(1)"
    title: "Alternate Storage Site — Separation from Primary Site"
    section: "Contingency Planning"
    description: >
      Identify an alternate storage site that is sufficiently separated
      from the primary storage site to reduce susceptibility to the
      same threats.
    implementation_guidance: >
      Evidence: Geographic separation of storage sites, AWS region
      separation documentation.

  - id: "CP-6(2)"
    title: "Alternate Storage Site — Recovery Time and Recovery Point Objectives"
    section: "Contingency Planning"
    description: >
      Configure the alternate storage site to facilitate recovery
      operations in accordance with recovery time and recovery
      point objectives.
    implementation_guidance: >
      Evidence: RTO and RPO documentation, backup frequency
      configuration supporting RPO, recovery time testing results.

  - id: "CP-7"
    title: "Alternate Processing Site"
    section: "Contingency Planning"
    description: >
      Establish an alternate processing site with necessary agreements
      to permit the resumption of operations for essential mission and
      business functions within a defined time period.
    implementation_guidance: >
      Evidence: AWS multi-region architecture, failover procedures,
      alternate processing site agreements.

  - id: "CP-7(1)"
    title: "Alternate Processing Site — Separation from Primary Site"
    section: "Contingency Planning"
    description: >
      Identify an alternate processing site sufficiently separated
      from the primary processing site.
    implementation_guidance: >
      Evidence: Geographic separation documentation, alternate region
      selection rationale.

  - id: "CP-7(2)"
    title: "Alternate Processing Site — Accessibility"
    section: "Contingency Planning"
    description: >
      Identify potential accessibility problems to the alternate
      processing site in the event of an area-wide disruption and
      outline explicit mitigation actions.
    implementation_guidance: >
      Evidence: Accessibility risk assessment for alternate site,
      mitigation planning documentation.

  - id: "CP-7(3)"
    title: "Alternate Processing Site — Priority of Service"
    section: "Contingency Planning"
    description: >
      Develop alternate processing site agreements that contain
      priority-of-service provisions.
    implementation_guidance: >
      Evidence: SLA documentation for alternate processing,
      priority of service agreement evidence.

  - id: "CP-7(6)"
    title: "Alternate Processing Site — Inability to Return to Primary Site"
    section: "Contingency Planning"
    description: >
      Plan and prepare for circumstances that preclude returning to
      the primary processing site.
    implementation_guidance: >
      Evidence: Long-term alternate site operations procedures,
      permanent failover planning documentation.

  - id: "CP-8"
    title: "Telecommunications Services"
    section: "Contingency Planning"
    description: >
      Establish alternate telecommunications services to resume essential
      mission and business functions within a defined time period when
      primary telecommunications are unavailable.
    implementation_guidance: >
      Evidence: Telecommunications redundancy documentation, 3CX
      failover configuration, ISP redundancy records.

  - id: "CP-8(1)"
    title: "Telecommunications Services — Priority of Service Provisions"
    section: "Contingency Planning"
    description: >
      Develop primary and alternate telecommunications service
      agreements that contain priority-of-service provisions.
    implementation_guidance: >
      Evidence: Priority of service agreements with telecom providers,
      service continuity SLAs.

  - id: "CP-8(2)"
    title: "Telecommunications Services — Single Points of Failure"
    section: "Contingency Planning"
    description: >
      Obtain alternate telecommunications services to reduce the
      likelihood of sharing a single point of failure with primary
      telecommunications services.
    implementation_guidance: >
      Evidence: Diverse path telecommunications documentation,
      ISP diversity evidence, single point of failure analysis.

  - id: "CP-9"
    title: "System Backup"
    section: "Contingency Planning"
    description: >
      Conduct backups of user-level, system-level, and system
      documentation at defined frequencies; protect backup information
      at the storage location.
    implementation_guidance: >
      Evidence: Backup policy, SQL Server backup schedule, AWS EBS
      snapshot configuration, backup job history records.

  - id: "CP-9(1)"
    title: "System Backup — Testing for Reliability and Integrity"
    section: "Contingency Planning"
    description: >
      Test backup information at a defined frequency to verify media
      reliability and information integrity.
    implementation_guidance: >
      Evidence: Backup restore testing records, EBS snapshot restore
      validation, backup integrity test results.

  - id: "CP-9(2)"
    title: "System Backup — Test Restoration Using Sampling"
    section: "Contingency Planning"
    description: >
      Use a sample of backup information in the restoration of selected
      system functions as part of contingency plan testing.
    implementation_guidance: >
      Evidence: Sample restore test records, restoration test results
      from contingency plan exercises.

  - id: "CP-9(5)"
    title: "System Backup — Transfer to Alternate Storage Site"
    section: "Contingency Planning"
    description: >
      Transfer system backup information to the alternate storage
      site at a defined time period and transfer rate consistent
      with recovery time and recovery point objectives.
    implementation_guidance: >
      Evidence: Cross-region backup transfer configuration,
      backup transfer schedule, alternate site backup verification.

  - id: "CP-9(8)"
    title: "System Backup — Cryptographic Protection"
    section: "Contingency Planning"
    description: >
      Implement cryptographic mechanisms to prevent unauthorized
      disclosure and modification of backup information.
    implementation_guidance: >
      Evidence: Backup encryption configuration, AWS KMS encryption
      for backups, encrypted backup verification.

  - id: "CP-10"
    title: "System Recovery and Reconstitution"
    section: "Contingency Planning"
    description: >
      Provide for the recovery and reconstitution of the system to a
      known state within a defined time period after a disruption,
      compromise, or failure.
    implementation_guidance: >
      Evidence: Recovery procedures, RTO documentation, backup
      restore validation, reconstitution procedures.

  - id: "CP-10(2)"
    title: "System Recovery and Reconstitution — Transaction Recovery"
    section: "Contingency Planning"
    description: >
      Implement transaction recovery for systems that are
      transaction-based.
    implementation_guidance: >
      Evidence: Database transaction recovery procedures, SQL Server
      transaction log backup configuration, database recovery testing.

  # ═══════════════════════════════════════════════════════════════════════════
  # IA — IDENTIFICATION AND AUTHENTICATION
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "IA-1"
    title: "Identification and Authentication Policy and Procedures"
    section: "Identification and Authentication"
    description: >
      Develop, document, and disseminate an identification and
      authentication policy and procedures; review and update at
      defined frequencies.
    implementation_guidance: >
      Evidence: IA policy, authentication procedures, policy review records.

  - id: "IA-2"
    title: "Identification and Authentication — Organizational Users"
    section: "Identification and Authentication"
    description: >
      Uniquely identify and authenticate organizational users and
      associate unique identification with processes acting on behalf
      of those users.
    implementation_guidance: >
      Evidence: User account uniqueness policy, identity management
      procedures, Entra ID user authentication configuration.

  - id: "IA-2(1)"
    title: "Identification and Authentication — MFA to Privileged Accounts"
    section: "Identification and Authentication"
    description: >
      Implement multi-factor authentication for access to privileged
      accounts.
    implementation_guidance: >
      Evidence: MFA enrollment report for privileged users, Entra ID
      conditional access policies requiring MFA for admins, MFA
      configuration screenshots.

  - id: "IA-2(2)"
    title: "Identification and Authentication — MFA to Non-Privileged Accounts"
    section: "Identification and Authentication"
    description: >
      Implement multi-factor authentication for access to non-privileged
      accounts.
    implementation_guidance: >
      Evidence: MFA enrollment report for all users, conditional access
      policy requiring MFA for all users, MFA compliance reports.

  - id: "IA-2(6)"
    title: "Identification and Authentication — Access to Accounts — Separate Device"
    section: "Identification and Authentication"
    description: >
      Implement multi-factor authentication for access to privileged
      and non-privileged accounts such that one factor is provided by
      a device separate from the system gaining access.
    implementation_guidance: >
      Evidence: Authenticator app configuration, hardware token policy,
      separate device MFA implementation evidence.

  - id: "IA-2(8)"
    title: "Identification and Authentication — Access to Accounts — Replay Resistant"
    section: "Identification and Authentication"
    description: >
      Implement replay-resistant authentication mechanisms for access
      to privileged accounts.
    implementation_guidance: >
      Evidence: FIDO2/WebAuthn or similar replay-resistant auth
      configuration, authentication mechanism documentation.

  - id: "IA-2(12)"
    title: "Identification and Authentication — Acceptance of PIV Credentials"
    section: "Identification and Authentication"
    description: >
      Accept and electronically verify Personal Identity Verification
      (PIV) credentials.
    implementation_guidance: >
      Evidence: PIV credential acceptance configuration, smart card
      authentication support documentation.

  - id: "IA-3"
    title: "Device Identification and Authentication"
    section: "Identification and Authentication"
    description: >
      Uniquely identify and authenticate devices before establishing
      connections to the system.
    implementation_guidance: >
      Evidence: Device certificate configuration, Intune device
      compliance and enrollment, device authentication policies.

  - id: "IA-4"
    title: "Identifier Management"
    section: "Identification and Authentication"
    description: >
      Manage system identifiers by receiving authorization to assign;
      selecting identifiers that identify individuals, groups, roles,
      services, or devices; preventing reuse of identifiers for a
      defined time period.
    implementation_guidance: >
      Evidence: Account naming conventions, identity management policy,
      Entra ID user management, identifier uniqueness evidence.

  - id: "IA-4(4)"
    title: "Identifier Management — Identify User Status"
    section: "Identification and Authentication"
    description: >
      Manage individual identifiers by uniquely identifying each
      individual with a defined characteristic identifying individual
      status.
    implementation_guidance: >
      Evidence: User status identification procedures, contractor vs
      employee account identification, user type labeling in Entra ID.

  - id: "IA-5"
    title: "Authenticator Management"
    section: "Identification and Authentication"
    description: >
      Manage system authenticators by verifying identity; establishing
      initial authenticator content; ensuring sufficient strength for
      intended use; establishing procedures for changes; protecting
      from unauthorized disclosure and modification.
    implementation_guidance: >
      Evidence: Password policy, MFA configuration, authenticator
      management procedures, PAM records.

  - id: "IA-5(1)"
    title: "Authenticator Management — Password-Based Authentication"
    section: "Identification and Authentication"
    description: >
      For password-based authentication: enforce minimum password
      complexity and change requirements; prohibit password reuse;
      allow use of temporary passwords; store and transmit only
      cryptographically protected passwords.
    implementation_guidance: >
      Evidence: Password policy configuration, Entra ID password
      settings, password complexity requirements evidence.

  - id: "IA-5(2)"
    title: "Authenticator Management — Public Key-Based Authentication"
    section: "Identification and Authentication"
    description: >
      For public key-based authentication: enforce authorized
      certification authorities; validate certificates before
      accepting; address certificate revocation.
    implementation_guidance: >
      Evidence: PKI configuration, certificate authority list,
      certificate validation procedures, CRL/OCSP configuration.

  - id: "IA-5(6)"
    title: "Authenticator Management — Protection of Authenticators"
    section: "Identification and Authentication"
    description: >
      Protect authenticators commensurate with the security category
      of the information to which use of the authenticator permits
      access.
    implementation_guidance: >
      Evidence: Authenticator protection policy, secure storage of
      authentication tokens, password vault usage evidence.

  - id: "IA-5(7)"
    title: "Authenticator Management — No Embedded Unencrypted Static Authenticators"
    section: "Identification and Authentication"
    description: >
      Ensure that unencrypted static authenticators are not embedded
      in applications or access scripts or stored on function keys.
    implementation_guidance: >
      Evidence: Code scanning for hardcoded credentials, secrets
      management procedures, static credential prohibition policy.

  - id: "IA-5(10)"
    title: "Authenticator Management — Dynamic Credential Binding"
    section: "Identification and Authentication"
    description: >
      Bind identities and authenticators dynamically using the
      following rules.
    implementation_guidance: >
      Evidence: Dynamic credential binding configuration, federation
      and SSO documentation.

  - id: "IA-6"
    title: "Authentication Feedback"
    section: "Identification and Authentication"
    description: >
      Obscure feedback of authentication information during the
      authentication process to protect from exploitation.
    implementation_guidance: >
      Evidence: Authentication interface showing obscured password
      entry, login page configuration.

  - id: "IA-7"
    title: "Cryptographic Module Authentication"
    section: "Identification and Authentication"
    description: >
      Implement mechanisms for authentication to a cryptographic module
      that meet applicable requirements for such authentication.
    implementation_guidance: >
      Evidence: FIPS 140-2 validated cryptographic module documentation,
      AWS KMS configuration, encryption policy.

  - id: "IA-8"
    title: "Identification and Authentication — Non-Organizational Users"
    section: "Identification and Authentication"
    description: >
      Uniquely identify and authenticate non-organizational users or
      processes acting on behalf of non-organizational users.
    implementation_guidance: >
      Evidence: External user authentication procedures, contractor
      access management, third-party authentication requirements.

  - id: "IA-8(1)"
    title: "Identification and Authentication — Acceptance of PIV Credentials from Other Agencies"
    section: "Identification and Authentication"
    description: >
      Accept and electronically verify Personal Identity Verification
      credentials from other federal agencies.
    implementation_guidance: >
      Evidence: Cross-agency PIV acceptance configuration, federal
      credential interoperability documentation.

  - id: "IA-8(2)"
    title: "Identification and Authentication — Acceptance of External Authenticators"
    section: "Identification and Authentication"
    description: >
      Accept only external authenticators that are NIST-compliant.
    implementation_guidance: >
      Evidence: Accepted external authenticator list, NIST compliance
      verification for external authenticators.

  - id: "IA-8(4)"
    title: "Identification and Authentication — Use of Defined Profiles"
    section: "Identification and Authentication"
    description: >
      Conform to the following profiles for identity management.
    implementation_guidance: >
      Evidence: Identity management profile documentation,
      federation standards compliance evidence.

  - id: "IA-11"
    title: "Re-Authentication"
    section: "Identification and Authentication"
    description: >
      Require users to re-authenticate when defined circumstances or
      situations occur.
    implementation_guidance: >
      Evidence: Re-authentication policy, session timeout configuration,
      Entra ID sign-in frequency settings, conditional access policies.

  - id: "IA-12"
    title: "Identity Proofing"
    section: "Identification and Authentication"
    description: >
      Proof the identities of users and devices before establishing
      accounts or issuing authenticators in accordance with defined
      requirements.
    implementation_guidance: >
      Evidence: Identity proofing procedures, background check
      integration with account provisioning, identity verification records.

  - id: "IA-12(2)"
    title: "Identity Proofing — Identity Evidence"
    section: "Identification and Authentication"
    description: >
      Require evidence of individual identity before issuing
      authenticators.
    implementation_guidance: >
      Evidence: Identity evidence collection procedures, pre-employment
      verification records.

  - id: "IA-12(3)"
    title: "Identity Proofing — Identity Evidence Validation and Verification"
    section: "Identification and Authentication"
    description: >
      Require validation and verification of identity evidence.
    implementation_guidance: >
      Evidence: Identity validation procedures, verification records.

  - id: "IA-12(4)"
    title: "Identity Proofing — In-Person Validation and Verification"
    section: "Identification and Authentication"
    description: >
      Require that the validation and verification of identity evidence
      be conducted in person before a designated registration authority.
    implementation_guidance: >
      Evidence: In-person validation procedures, registration authority
      designation.

  - id: "IA-12(5)"
    title: "Identity Proofing — Address Confirmation"
    section: "Identification and Authentication"
    description: >
      Require that a valid address is confirmed for the applicant.
    implementation_guidance: >
      Evidence: Address confirmation procedures, identity proofing
      address verification records.

  # ═══════════════════════════════════════════════════════════════════════════
  # IR — INCIDENT RESPONSE
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "IR-1"
    title: "Incident Response Policy and Procedures"
    section: "Incident Response"
    description: >
      Develop, document, and disseminate an incident response policy
      and procedures; review and update at defined frequencies.
    implementation_guidance: >
      Evidence: Incident response policy, IR procedures, policy
      review records.

  - id: "IR-2"
    title: "Incident Response Training"
    section: "Incident Response"
    description: >
      Provide incident response training to system users consistent
      with assigned roles within a defined time period; annually thereafter.
    implementation_guidance: >
      Evidence: IR training records, tabletop exercise records,
      training curriculum for IR roles.

  - id: "IR-2(1)"
    title: "Incident Response Training — Simulated Events"
    section: "Incident Response"
    description: >
      Incorporate simulated events into incident response training
      to facilitate effective response.
    implementation_guidance: >
      Evidence: IR tabletop exercise records, simulated phishing
      campaigns, simulated incident training documentation.

  - id: "IR-2(2)"
    title: "Incident Response Training — Automated Training Environments"
    section: "Incident Response"
    description: >
      Provide an automated environment for incident response training
      that simulates attack scenarios.
    implementation_guidance: >
      Evidence: Automated training platform records, simulated attack
      environment documentation.

  - id: "IR-3"
    title: "Incident Response Testing"
    section: "Incident Response"
    description: >
      Test the incident response capability at a defined frequency
      using defined tests and exercises.
    implementation_guidance: >
      Evidence: IR tabletop exercise records, test results, after-action
      reports.

  - id: "IR-3(2)"
    title: "Incident Response Testing — Coordination with Related Plans"
    section: "Incident Response"
    description: >
      Coordinate incident response testing with organizational elements
      responsible for related plans.
    implementation_guidance: >
      Evidence: Coordinated IR and BCP testing records, multi-plan
      exercise documentation.

  - id: "IR-4"
    title: "Incident Handling"
    section: "Incident Response"
    description: >
      Implement an incident handling capability including preparation,
      detection and analysis, containment, eradication, and recovery;
      coordinate with contingency planning activities.
    implementation_guidance: >
      Evidence: IR plan, incident handling procedures, incident records,
      phishing incident report.

  - id: "IR-4(1)"
    title: "Incident Handling — Automated Incident Handling Processes"
    section: "Incident Response"
    description: >
      Support the incident handling process using automated mechanisms.
    implementation_guidance: >
      Evidence: SIEM automation for incident handling, Security Hub
      automated response, CrowdStrike automated containment.

  - id: "IR-4(4)"
    title: "Incident Handling — Information Correlation"
    section: "Incident Response"
    description: >
      Correlate incident information and individual incident responses
      to achieve an organization-wide perspective on incident awareness
      and response.
    implementation_guidance: >
      Evidence: Log correlation procedures, cross-system incident
      correlation, incident management platform records.

  - id: "IR-4(6)"
    title: "Incident Handling — Insider Threats"
    section: "Incident Response"
    description: >
      Implement an incident handling capability for incidents involving
      insider threats.
    implementation_guidance: >
      Evidence: Insider threat incident handling procedures, user
      behavior analytics integration with IR process.

  - id: "IR-4(11)"
    title: "Incident Handling — Integrated Incident Response Team"
    section: "Incident Response"
    description: >
      Establish and maintain an integrated incident response team
      that can be deployed to any location within a defined time period
      to respond to incidents.
    implementation_guidance: >
      Evidence: IR team composition, deployment procedures, IR team
      contact list and availability documentation.

  - id: "IR-5"
    title: "Incident Monitoring"
    section: "Incident Response"
    description: >
      Track and document security incidents.
    implementation_guidance: >
      Evidence: Incident tracking log, Security Hub findings,
      CrowdStrike incident records, incident register.

  - id: "IR-5(1)"
    title: "Incident Monitoring — Automated Tracking, Data Collection, and Analysis"
    section: "Incident Response"
    description: >
      Track security incidents and collect and analyze incident
      information using automated mechanisms.
    implementation_guidance: >
      Evidence: Automated incident tracking system, SIEM for incident
      collection, Security Hub automated incident records.

  - id: "IR-6"
    title: "Incident Reporting"
    section: "Incident Response"
    description: >
      Require personnel to report suspected incidents within a defined
      time period; report incident information to designated authorities.
    implementation_guidance: >
      Evidence: Incident reporting procedures, reporting thresholds,
      IS event reporting policy.

  - id: "IR-6(1)"
    title: "Incident Reporting — Automated Reporting"
    section: "Incident Response"
    description: >
      Report incidents using automated mechanisms.
    implementation_guidance: >
      Evidence: Automated incident reporting configuration, automated
      notification to authorities on incident detection.

  - id: "IR-6(3)"
    title: "Incident Reporting — Supply Chain Coordination"
    section: "Incident Response"
    description: >
      Provide incident information to the provider of the product or
      service and other organizations involved in the supply chain
      for systems or system components related to the incident.
    implementation_guidance: >
      Evidence: Supply chain incident coordination procedures,
      vendor notification procedures for incidents.

  - id: "IR-7"
    title: "Incident Response Assistance"
    section: "Incident Response"
    description: >
      Provide an incident response support resource that offers advice
      and assistance for handling and reporting security incidents.
    implementation_guidance: >
      Evidence: IR support resources, help desk escalation paths,
      IR team composition documentation.

  - id: "IR-7(1)"
    title: "Incident Response Assistance — Automation Support for Availability of Information and Support"
    section: "Incident Response"
    description: >
      Increase the availability of incident response information and
      support using automated mechanisms.
    implementation_guidance: >
      Evidence: Automated IR knowledge base, ticketing system for
      IR support, automated IR guidance tools.

  - id: "IR-8"
    title: "Incident Response Plan"
    section: "Incident Response"
    description: >
      Develop an incident response plan providing a roadmap for
      implementing the IR capability; describing structure and
      organization; providing high-level approach for how the
      capability fits into the overall organization.
    implementation_guidance: >
      Evidence: Formal incident response plan, IR team roster,
      escalation procedures, communication plan.

  - id: "IR-9"
    title: "Information Spillage Response"
    section: "Incident Response"
    description: >
      Respond to information spills by identifying the specific
      information involved in the system contamination; alerting
      personnel; isolating the contaminated system; eradicating
      the information from contaminated systems.
    implementation_guidance: >
      Evidence: Data spill response procedures, information spillage
      response policy.

  - id: "IR-9(2)"
    title: "Information Spillage Response — Training"
    section: "Incident Response"
    description: >
      Provide information spillage response training at a defined
      frequency.
    implementation_guidance: >
      Evidence: Spillage response training records, data handling
      incident training documentation.

  - id: "IR-9(3)"
    title: "Information Spillage Response — Post-Spill Operations"
    section: "Incident Response"
    description: >
      Implement defined procedures to ensure that organizational
      personnel impacted by information spills can continue to
      carry out assigned tasks while contaminated systems are
      undergoing corrective actions.
    implementation_guidance: >
      Evidence: Post-spill continuity procedures, alternate work
      arrangements documentation.

  - id: "IR-9(4)"
    title: "Information Spillage Response — Exposure to Unauthorized Personnel"
    section: "Incident Response"
    description: >
      Employ defined actions for personnel exposed to information
      not within assigned access authorizations.
    implementation_guidance: >
      Evidence: Unauthorized exposure response procedures,
      personnel notification and response documentation.

  # ═══════════════════════════════════════════════════════════════════════════
  # MA — MAINTENANCE
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "MA-1"
    title: "Maintenance Policy and Procedures"
    section: "Maintenance"
    description: >
      Develop, document, and disseminate a maintenance policy and
      procedures; review and update at defined frequencies.
    implementation_guidance: >
      Evidence: Maintenance policy, equipment maintenance procedures,
      policy review records.

  - id: "MA-2"
    title: "Controlled Maintenance"
    section: "Maintenance"
    description: >
      Schedule, document, and review records of maintenance and repairs;
      approve and monitor maintenance activities; ensure maintenance
      is performed by authorized personnel.
    implementation_guidance: >
      Evidence: Maintenance logs, vendor maintenance records,
      authorized maintenance personnel list.

  - id: "MA-3"
    title: "Maintenance Tools"
    section: "Maintenance"
    description: >
      Approve, control, and monitor the use of system maintenance tools;
      inspect tools for improper or unauthorized modifications.
    implementation_guidance: >
      Evidence: Maintenance tool approval list, tool inspection records,
      tool control procedures.

  - id: "MA-3(1)"
    title: "Maintenance Tools — Inspect Tools"
    section: "Maintenance"
    description: >
      Inspect maintenance tools at a defined frequency for improper
      or unauthorized modifications.
    implementation_guidance: >
      Evidence: Tool inspection records, maintenance tool inventory,
      inspection procedures.

  - id: "MA-3(2)"
    title: "Maintenance Tools — Inspect Media"
    section: "Maintenance"
    description: >
      Check media containing diagnostic and test programs for malicious
      code before the media are used in the system.
    implementation_guidance: >
      Evidence: Media inspection procedures, malware scanning of
      maintenance media, inspection records.

  - id: "MA-4"
    title: "Nonlocal Maintenance"
    section: "Maintenance"
    description: >
      Approve and monitor nonlocal maintenance and diagnostic activities;
      allow use of nonlocal tools only consistent with policy;
      employ strong authenticators for nonlocal maintenance sessions.
    implementation_guidance: >
      Evidence: Remote maintenance procedures, MFA for remote
      maintenance, maintenance session logging.

  - id: "MA-4(2)"
    title: "Nonlocal Maintenance — Document Nonlocal Maintenance"
    section: "Maintenance"
    description: >
      Document in the security plan for the system policies and
      procedures for the establishment and use of nonlocal maintenance
      and diagnostic connections.
    implementation_guidance: >
      Evidence: Security plan nonlocal maintenance section, remote
      maintenance policy documentation.

  - id: "MA-5"
    title: "Maintenance Personnel"
    section: "Maintenance"
    description: >
      Establish a process for maintenance personnel authorization;
      maintain a list of authorized maintenance organizations or
      personnel; verify authorization of maintenance personnel.
    implementation_guidance: >
      Evidence: Authorized maintenance personnel list, vendor
      authorization records.

  - id: "MA-5(1)"
    title: "Maintenance Personnel — Individuals Without Appropriate Access"
    section: "Maintenance"
    description: >
      Implement procedures for the use of maintenance personnel that
      lack appropriate security clearances or are not U.S. citizens.
    implementation_guidance: >
      Evidence: Escort procedures for unclearable maintenance personnel,
      supervision requirements documentation.

  - id: "MA-6"
    title: "Timely Maintenance"
    section: "Maintenance"
    description: >
      Obtain maintenance support and spare parts for defined system
      components within a defined time period of failure.
    implementation_guidance: >
      Evidence: Maintenance support agreements, spare parts inventory,
      vendor support SLA documentation.

  # ═══════════════════════════════════════════════════════════════════════════
  # MP — MEDIA PROTECTION
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "MP-1"
    title: "Media Protection Policy and Procedures"
    section: "Media Protection"
    description: >
      Develop, document, and disseminate a media protection policy
      and procedures; review and update at defined frequencies.
    implementation_guidance: >
      Evidence: Media protection policy, storage media procedures,
      policy review records.

  - id: "MP-2"
    title: "Media Access"
    section: "Media Protection"
    description: >
      Restrict access to defined types of digital and non-digital
      media to authorized individuals.
    implementation_guidance: >
      Evidence: Media access controls, physical media storage
      procedures, media access restrictions documentation.

  - id: "MP-3"
    title: "Media Marking"
    section: "Media Protection"
    description: >
      Mark system media indicating distribution limitations, handling
      caveats, and applicable security markings.
    implementation_guidance: >
      Evidence: Information classification policy, media marking
      procedures, labeled media examples.

  - id: "MP-4"
    title: "Media Storage"
    section: "Media Protection"
    description: >
      Physically control and securely store digital and non-digital
      media within controlled areas.
    implementation_guidance: >
      Evidence: Physical security documentation, secure storage
      locations, media storage procedures.

  - id: "MP-5"
    title: "Media Transport"
    section: "Media Protection"
    description: >
      Protect and control digital and non-digital media during transport
      outside controlled areas using cryptographic mechanisms and
      documented custodians.
    implementation_guidance: >
      Evidence: Media transport policy, encryption for transported
      media, transport logging procedures.

  - id: "MP-6"
    title: "Media Sanitization"
    section: "Media Protection"
    description: >
      Sanitize system media prior to disposal, release out of
      organizational control, or release for reuse using defined
      techniques and procedures.
    implementation_guidance: >
      Evidence: Media sanitization policy, secure disposal procedures,
      sanitization records.

  - id: "MP-6(2)"
    title: "Media Sanitization — Equipment Testing"
    section: "Media Protection"
    description: >
      Test sanitization equipment and procedures at a defined frequency
      to verify correct performance.
    implementation_guidance: >
      Evidence: Sanitization equipment testing records, procedure
      verification documentation.

  - id: "MP-6(3)"
    title: "Media Sanitization — Nondestructive Techniques"
    section: "Media Protection"
    description: >
      Apply nondestructive sanitization techniques to portable storage
      devices prior to connecting such devices to the system.
    implementation_guidance: >
      Evidence: Nondestructive sanitization procedures, portable
      device sanitization records before connection.

  - id: "MP-7"
    title: "Media Use"
    section: "Media Protection"
    description: >
      Restrict or prohibit the use of defined types of system media
      on defined systems.
    implementation_guidance: >
      Evidence: Removable media policy, USB restrictions in Intune,
      acceptable use policy for media.

  - id: "MP-7(1)"
    title: "Media Use — Prohibit Use Without Identifiable Owner"
    section: "Media Protection"
    description: >
      Prohibit the use of portable storage devices in organizational
      systems when such devices have no identifiable owner.
    implementation_guidance: >
      Evidence: Removable media policy requiring identifiable owner,
      Intune restriction on anonymous media, media ownership procedures.

  # ═══════════════════════════════════════════════════════════════════════════
  # PE — PHYSICAL AND ENVIRONMENTAL PROTECTION
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "PE-1"
    title: "Physical and Environmental Protection Policy and Procedures"
    section: "Physical and Environmental Protection"
    description: >
      Develop, document, and disseminate a physical and environmental
      protection policy and procedures; review and update at defined
      frequencies.
    implementation_guidance: >
      Evidence: Physical security policy, environmental protection
      procedures, policy review records.

  - id: "PE-2"
    title: "Physical Access Authorizations"
    section: "Physical and Environmental Protection"
    description: >
      Develop, approve, and maintain a list of individuals with
      authorized access to the facility; issue authorization credentials;
      review the access list at defined frequencies; remove individuals
      when access is no longer required.
    implementation_guidance: >
      Evidence: Physical access authorization list, access credential
      records, periodic access review records.

  - id: "PE-3"
    title: "Physical Access Control"
    section: "Physical and Environmental Protection"
    description: >
      Enforce physical access authorizations at defined entry and exit
      points; maintain physical access audit logs; control access to
      publicly accessible areas.
    implementation_guidance: >
      Evidence: Physical security site assessment, access control
      system records, physical entry policy, visitor logs.

  - id: "PE-3(1)"
    title: "Physical Access Control — Electronic Physical Access Devices"
    section: "Physical and Environmental Protection"
    description: >
      Use electronic access control systems or devices to achieve
      physical access control.
    implementation_guidance: >
      Evidence: Electronic access control system configuration,
      badge reader records, electronic entry system documentation.

  - id: "PE-4"
    title: "Access Control for Transmission"
    section: "Physical and Environmental Protection"
    description: >
      Control physical access to system distribution and transmission
      lines within organizational facilities.
    implementation_guidance: >
      Evidence: Cabling security policy, physical protection of
      network transmission lines, locked wiring closets.

  - id: "PE-5"
    title: "Access Control for Output Devices"
    section: "Physical and Environmental Protection"
    description: >
      Control physical access to output from defined output devices
      to prevent unauthorized individuals from obtaining the output.
    implementation_guidance: >
      Evidence: Printer security procedures, output device access
      controls, print release procedures.

  - id: "PE-6"
    title: "Monitoring Physical Access"
    section: "Physical and Environmental Protection"
    description: >
      Monitor physical access to the facility to detect and respond
      to physical security incidents.
    implementation_guidance: >
      Evidence: Physical security monitoring policy, camera records,
      security monitoring evidence, site assessment.

  - id: "PE-6(1)"
    title: "Monitoring Physical Access — Intrusion Alarms and Surveillance Equipment"
    section: "Physical and Environmental Protection"
    description: >
      Monitor physical access to the facility using physical intrusion
      alarms and surveillance equipment.
    implementation_guidance: >
      Evidence: Intrusion alarm system records, surveillance camera
      configuration, monitoring equipment records.

  - id: "PE-8"
    title: "Visitor Access Records"
    section: "Physical and Environmental Protection"
    description: >
      Maintain visitor access records to the facility for a defined
      time period; review visitor access records at a defined frequency.
    implementation_guidance: >
      Evidence: Visitor log, visitor access procedures, record
      retention for visitor logs.

  - id: "PE-8(1)"
    title: "Visitor Access Records — Automated Records Maintenance and Review"
    section: "Physical and Environmental Protection"
    description: >
      Maintain and review visitor access records using automated
      mechanisms.
    implementation_guidance: >
      Evidence: Electronic visitor management system, automated
      visitor log records.

  - id: "PE-9"
    title: "Power Equipment and Cabling"
    section: "Physical and Environmental Protection"
    description: >
      Protect power equipment and power cabling for the system from
      damage and destruction.
    implementation_guidance: >
      Evidence: Power protection procedures, UPS configuration,
      power cable protection documentation.

  - id: "PE-10"
    title: "Emergency Shutoff"
    section: "Physical and Environmental Protection"
    description: >
      Provide the capability of shutting off power to any system
      component; place emergency shutoff switches in a location
      to facilitate safe and easy access.
    implementation_guidance: >
      Evidence: Emergency shutoff location documentation, power
      cutoff procedures, facility assessment.

  - id: "PE-11"
    title: "Emergency Power"
    section: "Physical and Environmental Protection"
    description: >
      Provide an uninterruptible power supply to facilitate an orderly
      shutdown of the system in the event of a primary power source loss.
    implementation_guidance: >
      Evidence: UPS configuration and capacity records, emergency
      power procedures, facility assessment.

  - id: "PE-11(1)"
    title: "Emergency Power — Alternate Power Supply — Minimal Operational Capability"
    section: "Physical and Environmental Protection"
    description: >
      Provide an alternate power supply for the system that is activated
      by a manual or automatic transfer switch and is capable of
      maintaining minimally required operational capability in the event
      of an extended loss of the primary power source.
    implementation_guidance: >
      Evidence: Generator or alternate power system documentation,
      automatic transfer switch configuration, power continuity records.

  - id: "PE-12"
    title: "Emergency Lighting"
    section: "Physical and Environmental Protection"
    description: >
      Employ and maintain automatic emergency lighting that activates
      in the event of a power outage or disruption.
    implementation_guidance: >
      Evidence: Emergency lighting inspection records, facility
      assessment documentation.

  - id: "PE-13"
    title: "Fire Protection"
    section: "Physical and Environmental Protection"
    description: >
      Employ and maintain fire suppression and detection systems
      and devices that can be activated in the event of a fire.
    implementation_guidance: >
      Evidence: Fire suppression system records, fire detection
      device inspection, facility assessment.

  - id: "PE-13(2)"
    title: "Fire Protection — Suppression Systems — Automatic Notification"
    section: "Physical and Environmental Protection"
    description: >
      Employ fire suppression systems that provide automatic
      notification to defined personnel when activated.
    implementation_guidance: >
      Evidence: Fire suppression automatic notification configuration,
      alert recipient list for fire events.

  - id: "PE-13(3)"
    title: "Fire Protection — Automatic Fire Suppression"
    section: "Physical and Environmental Protection"
    description: >
      Employ an automatic fire suppression capability when the facility
      is not staffed on a continuous basis.
    implementation_guidance: >
      Evidence: Automatic fire suppression system documentation,
      facility staffing analysis, suppression system records.

  - id: "PE-14"
    title: "Environmental Controls"
    section: "Physical and Environmental Protection"
    description: >
      Maintain temperature and humidity levels within the facility
      at defined acceptable levels.
    implementation_guidance: >
      Evidence: Environmental monitoring records, HVAC maintenance,
      data center environmental controls.

  - id: "PE-14(2)"
    title: "Environmental Controls — Monitoring with Alarms and Notifications"
    section: "Physical and Environmental Protection"
    description: >
      Employ environmental control monitoring that provides an alarm
      or notification when changes occur that are outside defined
      thresholds.
    implementation_guidance: >
      Evidence: Environmental monitoring alarm configuration,
      temperature and humidity alert thresholds.

  - id: "PE-15"
    title: "Water Damage Protection"
    section: "Physical and Environmental Protection"
    description: >
      Protect the system from damage resulting from water leakage
      by providing master shutoff or isolation valves that are
      accessible, working properly, and known to key personnel.
    implementation_guidance: >
      Evidence: Water damage protection procedures, facility
      assessment, shutoff valve documentation.

  - id: "PE-16"
    title: "Delivery and Removal"
    section: "Physical and Environmental Protection"
    description: >
      Authorize and control system-related items entering and exiting
      the facility and maintain records of items.
    implementation_guidance: >
      Evidence: Delivery and removal authorization procedures,
      asset tracking for physical deliveries.

  - id: "PE-17"
    title: "Alternate Work Site"
    section: "Physical and Environmental Protection"
    description: >
      Implement defined controls for alternate work sites; assess
      as feasible the effectiveness of controls at alternate work
      sites.
    implementation_guidance: >
      Evidence: Remote work security controls, remote working policy,
      telework security assessment.

  - id: "PE-18"
    title: "Location of System Components"
    section: "Physical and Environmental Protection"
    description: >
      Position system components within the facility to minimize
      potential damage from defined physical and environmental hazards.
    implementation_guidance: >
      Evidence: Physical placement documentation, facility assessment
      showing component positioning.

  # ═══════════════════════════════════════════════════════════════════════════
  # PL — PLANNING
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "PL-1"
    title: "Planning Policy and Procedures"
    section: "Planning"
    description: >
      Develop, document, and disseminate security and privacy planning
      policy and procedures; review and update at defined frequencies.
    implementation_guidance: >
      Evidence: Security planning policy, planning procedures,
      policy review records.

  - id: "PL-2"
    title: "System Security and Privacy Plans"
    section: "Planning"
    description: >
      Develop security and privacy plans describing security and privacy
      requirements and controls; review and approve by authorizing
      official; distribute and update plans.
    implementation_guidance: >
      Evidence: System Security Plan (SSP), Privacy Impact Assessment
      (PIA), system boundary documentation, AO approval.

  - id: "PL-4"
    title: "Rules of Behavior"
    section: "Planning"
    description: >
      Establish and provide rules describing responsibilities and
      expected behavior regarding system and information usage;
      obtain documented acknowledgment.
    implementation_guidance: >
      Evidence: Acceptable use policy, rules of behavior document,
      signed acknowledgments, policy acknowledgment log.

  - id: "PL-4(1)"
    title: "Rules of Behavior — Social Media and External Site Usage Restrictions"
    section: "Planning"
    description: >
      Include in the rules of behavior explicit restrictions on the
      use of social media and external sites and posting organizational
      information on public websites.
    implementation_guidance: >
      Evidence: Social media policy, acceptable use policy covering
      external sites, rules of behavior with social media provisions.

  - id: "PL-7"
    title: "Concept of Operations"
    section: "Planning"
    description: >
      Develop a Concept of Operations (CONOPS) for the system describing
      how the organization intends to operate the system.
    implementation_guidance: >
      Evidence: System CONOPS documentation, operational concept
      description, system use cases.

  - id: "PL-8"
    title: "Security and Privacy Architectures"
    section: "Planning"
    description: >
      Develop security and privacy architectures describing requirements
      and approach for protecting confidentiality, integrity, and
      availability of organizational information.
    implementation_guidance: >
      Evidence: Security architecture documentation, system architecture
      description, network diagrams, VPC documentation.

  - id: "PL-8(1)"
    title: "Security and Privacy Architectures — Defense in Depth"
    section: "Planning"
    description: >
      Design the security and privacy architectures for the system
      using a defense-in-depth approach that allocates security and
      privacy safeguards to protect against defined threats.
    implementation_guidance: >
      Evidence: Defense-in-depth architecture documentation, layered
      security controls evidence, security architecture review records.

  - id: "PL-9"
    title: "Central Management"
    section: "Planning"
    description: >
      Centrally manage defined controls and related processes.
    implementation_guidance: >
      Evidence: Centralized management platform documentation,
      central policy enforcement evidence.

  - id: "PL-10"
    title: "Baseline Selection"
    section: "Planning"
    description: >
      Select a control baseline for the system.
    implementation_guidance: >
      Evidence: Control baseline selection rationale, FIPS 199
      categorization supporting baseline selection.

  - id: "PL-11"
    title: "Baseline Tailoring"
    section: "Planning"
    description: >
      Tailor the selected control baseline by applying specified
      tailoring actions.
    implementation_guidance: >
      Evidence: Tailoring decisions documentation, scoping guidance
      applied, control additions and removals with justification.

  # ═══════════════════════════════════════════════════════════════════════════
  # PS — PERSONNEL SECURITY
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "PS-1"
    title: "Personnel Security Policy and Procedures"
    section: "Personnel Security"
    description: >
      Develop, document, and disseminate a personnel security policy
      and procedures; review and update at defined frequencies.
    implementation_guidance: >
      Evidence: Personnel security policy, HR security procedures,
      policy review records.

  - id: "PS-2"
    title: "Position Risk Designation"
    section: "Personnel Security"
    description: >
      Assign a risk designation to all organizational positions;
      establish screening criteria; review and update position
      risk designations at defined frequencies.
    implementation_guidance: >
      Evidence: Position risk designation records, role-based risk
      classification, screening requirements by position.

  - id: "PS-3"
    title: "Personnel Screening"
    section: "Personnel Security"
    description: >
      Screen individuals prior to authorizing access; rescreen
      individuals according to defined conditions.
    implementation_guidance: >
      Evidence: Background check policy, screening records, screening
      procedures, active employee screening status.

  - id: "PS-3(3)"
    title: "Personnel Screening — Information with Special Protection Measures"
    section: "Personnel Security"
    description: >
      Verify that individuals accessing a system processing, storing,
      or transmitting information requiring special protection have
      valid access authorizations demonstrated by assigned official
      government duties.
    implementation_guidance: >
      Evidence: PHI access authorization records, special protection
      access verification procedures, BOP contract access requirements.

  - id: "PS-4"
    title: "Personnel Termination"
    section: "Personnel Security"
    description: >
      Upon termination, disable system access within a defined time
      period; terminate authenticators; conduct exit interviews;
      retrieve security-related property.
    implementation_guidance: >
      Evidence: Termination procedures, offboarding audit logs,
      termination tickets, access revocation records.

  - id: "PS-4(2)"
    title: "Personnel Termination — Automated Notification"
    section: "Personnel Security"
    description: >
      Notify defined personnel or roles within a defined time period
      upon termination of an individual.
    implementation_guidance: >
      Evidence: Automated termination notification configuration,
      HR-to-IT notification workflow, termination notification records.

  - id: "PS-5"
    title: "Personnel Transfer"
    section: "Personnel Security"
    description: >
      Review and confirm ongoing need for current access authorizations
      when individuals are reassigned or transferred; initiate appropriate
      actions within a defined time period.
    implementation_guidance: >
      Evidence: Transfer procedures, access review upon transfer,
      account modification records.

  - id: "PS-6"
    title: "Access Agreements"
    section: "Personnel Security"
    description: >
      Develop and document access agreements; review and update
      periodically; ensure individuals sign appropriate agreements
      before being granted access.
    implementation_guidance: >
      Evidence: PIIA agreements, NDAs, acceptable use acknowledgments,
      access agreement log.

  - id: "PS-7"
    title: "External Personnel Security"
    section: "Personnel Security"
    description: >
      Establish personnel security requirements for external providers;
      require external providers to comply with personnel security
      policies.
    implementation_guidance: >
      Evidence: Third-party personnel security requirements, contractor
      access agreements, supplier security review matrix.

  - id: "PS-8"
    title: "Personnel Sanctions"
    section: "Personnel Security"
    description: >
      Employ a formal sanctions process for individuals failing to
      comply with security and privacy policies; notify designated
      personnel when sanctions are initiated.
    implementation_guidance: >
      Evidence: Disciplinary policy, sanctions process documentation,
      HR policy, disciplinary procedure records.

  - id: "PS-9"
    title: "Position Descriptions"
    section: "Personnel Security"
    description: >
      Establish and maintain position descriptions that include security
      roles, responsibilities, and requirements for all positions.
    implementation_guidance: >
      Evidence: Position descriptions with security roles, job
      descriptions including security responsibilities.

  # ═══════════════════════════════════════════════════════════════════════════
  # PT — PII PROCESSING AND TRANSPARENCY
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "PT-1"
    title: "Personally Identifiable Information Processing and Transparency Policy"
    section: "PII Processing and Transparency"
    description: >
      Develop, document, and disseminate a PII processing and transparency
      policy and procedures; review and update at defined frequencies.
    implementation_guidance: >
      Evidence: Privacy policy, PII handling procedures, HIPAA policy,
      policy review records.

  - id: "PT-2"
    title: "Authority to Process Personally Identifiable Information"
    section: "PII Processing and Transparency"
    description: >
      Determine and document the legal authorities that permit the
      processing of PII; restrict the processing of PII to only
      that which is authorized.
    implementation_guidance: >
      Evidence: Legal authority documentation for PHI processing,
      BOP contract authorization, HIPAA BAA, data processing agreements.

  - id: "PT-3"
    title: "Personally Identifiable Information Processing Purposes"
    section: "PII Processing and Transparency"
    description: >
      Identify and document the purpose for processing PII;
      restrict the processing of PII to only that compatible with
      the identified purposes.
    implementation_guidance: >
      Evidence: Data processing purpose documentation, privacy
      impact assessment, PHI use limitation records.

  - id: "PT-4"
    title: "Consent"
    section: "PII Processing and Transparency"
    description: >
      Implement consent mechanisms to support individuals' ability
      to provide consent prior to or at the time of processing of
      PII; implement mechanisms to withdraw consent.
    implementation_guidance: >
      Evidence: Consent procedures, consent forms, consent withdrawal
      procedures, privacy notice.

  - id: "PT-5"
    title: "Privacy Notice"
    section: "PII Processing and Transparency"
    description: >
      Provide privacy notice to individuals about the processing of
      PII at the time of collection or before or after collection if
      collection is not direct from individuals.
    implementation_guidance: >
      Evidence: Privacy notice, privacy statement, notice at collection,
      PII handling statement.

  - id: "PT-5(1)"
    title: "Privacy Notice — Privacy Notice for Children"
    section: "PII Processing and Transparency"
    description: >
      Present privacy notice to individuals about the processing of
      PII in a manner that is distinct and clearly tailored for children.
    implementation_guidance: >
      Evidence: Children's privacy notice (if applicable), age
      verification procedures.

  - id: "PT-5(2)"
    title: "Privacy Notice — Just-in-Time Notice"
    section: "PII Processing and Transparency"
    description: >
      Present privacy notice to individuals at the time of and for
      the specific type of PII collection using clear and plain language.
    implementation_guidance: >
      Evidence: Just-in-time privacy notification implementation,
      point-of-collection privacy notice evidence.

  - id: "PT-6"
    title: "System of Records Notice"
    section: "PII Processing and Transparency"
    description: >
      For systems subject to the Privacy Act, maintain systems of
      records notices in accordance with Privacy Act requirements.
    implementation_guidance: >
      Evidence: System of records notice (SORN) if applicable,
      Privacy Act compliance documentation.

  - id: "PT-7"
    title: "Specific Categories of Personally Identifiable Information"
    section: "PII Processing and Transparency"
    description: >
      Apply additional processing conditions and safeguards to specific
      categories of PII.
    implementation_guidance: >
      Evidence: PHI handling procedures, sensitive PII category
      identification, additional safeguards for sensitive categories.

  - id: "PT-7(1)"
    title: "Specific Categories of PII — Social Security Numbers"
    section: "PII Processing and Transparency"
    description: >
      When a system processes Social Security numbers, employ additional
      safeguards for those numbers.
    implementation_guidance: >
      Evidence: SSN handling policy, SSN encryption and masking
      procedures, SSN access restrictions.

  - id: "PT-7(2)"
    title: "Specific Categories of PII — Biometric Information"
    section: "PII Processing and Transparency"
    description: >
      When a system processes biometric information, employ additional
      safeguards for that information.
    implementation_guidance: >
      Evidence: Biometric data handling policy (if applicable),
      biometric data security procedures.

  # ═══════════════════════════════════════════════════════════════════════════
  # RA — RISK ASSESSMENT
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "RA-1"
    title: "Risk Assessment Policy and Procedures"
    section: "Risk Assessment"
    description: >
      Develop, document, and disseminate a risk assessment policy
      and procedures; review and update at defined frequencies.
    implementation_guidance: >
      Evidence: Risk assessment policy, risk management procedures,
      policy review records.

  - id: "RA-2"
    title: "Security Categorization"
    section: "Risk Assessment"
    description: >
      Categorize the system and information it processes; document
      the security categorization results; ensure the authorizing
      official reviews and approves the categorization.
    implementation_guidance: >
      Evidence: FIPS 199 categorization, system security plan
      categorization section, AO approval.

  - id: "RA-3"
    title: "Risk Assessment"
    section: "Risk Assessment"
    description: >
      Conduct a risk assessment including likelihood and magnitude
      of harm from unauthorized access, use, disclosure, disruption,
      modification, or destruction; integrate results into the risk
      management program.
    implementation_guidance: >
      Evidence: IS risk register, risk assessment methodology,
      risk treatment plan, risk treatment implementation evidence.

  - id: "RA-3(1)"
    title: "Risk Assessment — Supply Chain Risk Assessment"
    section: "Risk Assessment"
    description: >
      Assess supply chain risks associated with defined systems,
      system components, or system services; update the supply
      chain risk assessment at defined frequencies or when there
      are significant changes.
    implementation_guidance: >
      Evidence: Supply chain risk assessment, supplier security
      review matrix, third-party risk assessments.

  - id: "RA-5"
    title: "Vulnerability Monitoring and Scanning"
    section: "Risk Assessment"
    description: >
      Monitor and scan for vulnerabilities at defined frequencies
      and when new vulnerabilities are identified; analyze scan
      reports; remediate vulnerabilities within defined response
      times.
    implementation_guidance: >
      Evidence: Vulnerability scan reports, patch compliance report,
      pen test report, CrowdStrike findings, remediation tracking.

  - id: "RA-5(2)"
    title: "Vulnerability Monitoring and Scanning — Update Vulnerabilities to Be Scanned"
    section: "Risk Assessment"
    description: >
      Update the system vulnerabilities scanned prior to a new scan;
      update the vulnerabilities scanned at a defined frequency.
    implementation_guidance: >
      Evidence: Vulnerability database update records, scanner update
      configuration, current vulnerability signatures evidence.

  - id: "RA-5(4)"
    title: "Vulnerability Monitoring and Scanning — Discoverable Information"
    section: "Risk Assessment"
    description: >
      Determine what information about the system is discoverable
      by adversaries and take defined corrective actions.
    implementation_guidance: >
      Evidence: Information exposure assessment, OSINT analysis
      of organizational exposure, corrective actions for discoverable
      sensitive information.

  - id: "RA-5(5)"
    title: "Vulnerability Monitoring and Scanning — Privileged Access"
    section: "Risk Assessment"
    description: >
      Implement privileged access authorization to defined system
      components for selected vulnerability scanning activities.
    implementation_guidance: >
      Evidence: Privileged scan credential procedures, authenticated
      vulnerability scan configuration.

  - id: "RA-5(11)"
    title: "Vulnerability Monitoring and Scanning — Public Disclosure Program"
    section: "Risk Assessment"
    description: >
      Establish a public reporting channel for receiving reports
      of vulnerabilities in organizational systems and system
      components.
    implementation_guidance: >
      Evidence: Vulnerability disclosure policy, public reporting
      channel documentation, responsible disclosure program.

  - id: "RA-7"
    title: "Risk Response"
    section: "Risk Assessment"
    description: >
      Respond to findings from security and privacy assessments,
      monitoring, and audits.
    implementation_guidance: >
      Evidence: Risk treatment plan, corrective action records,
      POA&M, risk acceptance documentation.

  - id: "RA-9"
    title: "Criticality Analysis"
    section: "Risk Assessment"
    description: >
      Identify critical system components and functions by performing
      a criticality analysis for defined systems, system components,
      or system services at defined decision points in the SDLC.
    implementation_guidance: >
      Evidence: Criticality analysis documentation, critical system
      component identification, mission-essential function analysis.

  # ═══════════════════════════════════════════════════════════════════════════
  # SA — SYSTEM AND SERVICES ACQUISITION
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "SA-1"
    title: "System and Services Acquisition Policy and Procedures"
    section: "System and Services Acquisition"
    description: >
      Develop, document, and disseminate a system and services
      acquisition policy and procedures; review and update at
      defined frequencies.
    implementation_guidance: >
      Evidence: Acquisition policy, procurement procedures,
      policy review records.

  - id: "SA-2"
    title: "Allocation of Resources"
    section: "System and Services Acquisition"
    description: >
      Determine security and privacy requirements for the system
      in mission and business process planning; determine, document,
      and allocate the resources required to protect the system.
    implementation_guidance: >
      Evidence: Security budget documentation, resource allocation
      records, IS objectives and KPIs.

  - id: "SA-3"
    title: "System Development Life Cycle"
    section: "System and Services Acquisition"
    description: >
      Acquire, develop, and manage the system using a system
      development life cycle incorporating security and privacy
      considerations; define security and privacy roles throughout
      the SDLC.
    implementation_guidance: >
      Evidence: SDLC policy, secure development lifecycle documentation,
      security requirements in development processes.

  - id: "SA-4"
    title: "Acquisition Process"
    section: "System and Services Acquisition"
    description: >
      Include required security and privacy controls in acquisition
      contracts based on applicable laws, directives, regulations,
      policies, standards, and organizational needs.
    implementation_guidance: >
      Evidence: Contract security requirements, supplier agreement
      security clauses, acquisition checklist.

  - id: "SA-4(1)"
    title: "Acquisition Process — Functional Properties of Controls"
    section: "System and Services Acquisition"
    description: >
      Require the developer of the system, system component, or
      system service to provide a description of the functional
      properties of the controls to be implemented.
    implementation_guidance: >
      Evidence: Security requirements specifying functional properties,
      vendor security documentation requirements.

  - id: "SA-4(2)"
    title: "Acquisition Process — Design and Implementation Information for Controls"
    section: "System and Services Acquisition"
    description: >
      Require the developer to provide design and implementation
      information for the controls to be implemented.
    implementation_guidance: >
      Evidence: Vendor design documentation requirements, control
      implementation details from suppliers.

  - id: "SA-4(5)"
    title: "Acquisition Process — System, Component, and Service Configurations"
    section: "System and Services Acquisition"
    description: >
      Require the developer of the system, system component, or
      system service to deliver the system, component, or service
      with a defined secure configuration.
    implementation_guidance: >
      Evidence: Secure configuration delivery requirements, baseline
      configuration specifications in contracts.

  - id: "SA-4(9)"
    title: "Acquisition Process — Functions, Ports, Protocols, and Services in Use"
    section: "System and Services Acquisition"
    description: >
      Require the developer of the system, system component, or
      system service to identify the functions, ports, protocols,
      and services intended for organizational use.
    implementation_guidance: >
      Evidence: Required service and port documentation in contracts,
      vendor-provided service inventory.

  - id: "SA-4(10)"
    title: "Acquisition Process — Use of Approved PIV Products"
    section: "System and Services Acquisition"
    description: >
      Employ only information technology products on the FIPS 201
      approved products list for PIV capability implemented within
      organizational systems.
    implementation_guidance: >
      Evidence: FIPS 201 approved product usage documentation,
      PIV product approval records.

  - id: "SA-5"
    title: "System Documentation"
    section: "System and Services Acquisition"
    description: >
      Obtain or develop administrator documentation; document
      secure configuration, installation, and operation; document
      effective use and maintenance of security and privacy controls.
    implementation_guidance: >
      Evidence: System documentation, configuration guides,
      operational procedures, architecture documentation.

  - id: "SA-8"
    title: "Security and Privacy Engineering Principles"
    section: "System and Services Acquisition"
    description: >
      Apply security and privacy engineering principles in the
      specification, design, development, implementation, and
      modification of the system.
    implementation_guidance: >
      Evidence: Secure system architecture description, security
      engineering principles documentation, design review records.

  - id: "SA-9"
    title: "External System Services"
    section: "System and Services Acquisition"
    description: >
      Require that providers of external system services comply
      with organizational security and privacy requirements;
      employ appropriate controls; define and document oversight
      and user roles regarding external services.
    implementation_guidance: >
      Evidence: Supplier security review matrix, third-party
      agreements, AWS FedRAMP authorization, BAAs.

  - id: "SA-9(2)"
    title: "External System Services — Identification of Functions, Ports, Protocols, and Services"
    section: "System and Services Acquisition"
    description: >
      Require providers of the following external system services
      to identify the functions, ports, protocols, and other
      services required for the use of such services.
    implementation_guidance: >
      Evidence: External service inventory, vendor-provided
      documentation of services, ports, and protocols.

  - id: "SA-10"
    title: "Developer Configuration Management"
    section: "System and Services Acquisition"
    description: >
      Require the developer of the system to perform configuration
      management; document approved changes; track security flaws
      and flaw resolution.
    implementation_guidance: >
      Evidence: Change management records, Azure DevOps activity
      logs, developer security requirements.

  - id: "SA-11"
    title: "Developer Testing and Evaluation"
    section: "System and Services Acquisition"
    description: >
      Require the developer to implement a security and privacy
      assessment plan; perform unit, integration, system, and
      regression testing; produce evidence of test execution.
    implementation_guidance: >
      Evidence: Security testing policy, pen test report, application
      security requirements, testing records.

  - id: "SA-11(1)"
    title: "Developer Testing and Evaluation — Static Code Analysis"
    section: "System and Services Acquisition"
    description: >
      Require the developer to employ static code analysis tools
      to identify common flaws and document the results.
    implementation_guidance: >
      Evidence: Static code analysis tool records, SAST scan results,
      code review procedures.

  - id: "SA-11(2)"
    title: "Developer Testing and Evaluation — Threat Modeling and Vulnerability Analyses"
    section: "System and Services Acquisition"
    description: >
      Require the developer to perform threat modeling and a
      vulnerability analysis for the system during development.
    implementation_guidance: >
      Evidence: Threat model documentation, vulnerability analysis
      during development, SDLC security documentation.

  - id: "SA-15"
    title: "Development Process, Standards, and Tools"
    section: "System and Services Acquisition"
    description: >
      Require the developer of the system to follow a documented
      development process; address security and privacy requirements;
      define and document tools used.
    implementation_guidance: >
      Evidence: Development process documentation, secure coding
      standards, development tools inventory.

  - id: "SA-16"
    title: "Developer-Provided Training"
    section: "System and Services Acquisition"
    description: >
      Require the developer of the system to provide defined
      training on the correct use and operation of the implemented
      security and privacy functions, controls, and mechanisms.
    implementation_guidance: >
      Evidence: Developer-provided training records, security
      feature training documentation.

  - id: "SA-17"
    title: "Developer Security and Privacy Architecture and Design"
    section: "System and Services Acquisition"
    description: >
      Require the developer of the system to produce a design
      specification and security and privacy architecture aligned
      with organizational security and privacy policies and
      established architecture.
    implementation_guidance: >
      Evidence: System security architecture documentation, design
      specifications, security architecture review.

  - id: "SA-21"
    title: "Developer Screening"
    section: "System and Services Acquisition"
    description: >
      Require that the developer of defined systems, system
      components, or system services satisfy defined personnel
      screening criteria.
    implementation_guidance: >
      Evidence: Developer screening requirements, contractor
      background check policy, developer vetting records.

  - id: "SA-22"
    title: "Unsupported System Components"
    section: "System and Services Acquisition"
    description: >
      Replace system components when support for the components
      is no longer available from the developer, vendor, or
      manufacturer; or provide defined in-house support options.
    implementation_guidance: >
      Evidence: End-of-life component tracking, replacement plans
      for unsupported components, vendor support status records.

  # ═══════════════════════════════════════════════════════════════════════════
  # SC — SYSTEM AND COMMUNICATIONS PROTECTION
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "SC-1"
    title: "System and Communications Protection Policy and Procedures"
    section: "System and Communications Protection"
    description: >
      Develop, document, and disseminate a system and communications
      protection policy and procedures; review and update at
      defined frequencies.
    implementation_guidance: >
      Evidence: Network security policy, communications protection
      policy, policy review records.

  - id: "SC-3"
    title: "Security Function Isolation"
    section: "System and Communications Protection"
    description: >
      Isolate security functions from nonsecurity functions.
    implementation_guidance: >
      Evidence: Security function isolation architecture, separate
      security domains documentation, AWS account separation.

  - id: "SC-4"
    title: "Information in Shared System Resources"
    section: "System and Communications Protection"
    description: >
      Prevent unauthorized and unintended information transfer
      via shared system resources.
    implementation_guidance: >
      Evidence: Shared resource management procedures, memory
      scrubbing procedures, shared storage access controls.

  - id: "SC-5"
    title: "Denial of Service Protection"
    section: "System and Communications Protection"
    description: >
      Implement controls to protect against or limit the effects
      of denial of service events.
    implementation_guidance: >
      Evidence: AWS Shield configuration, WAF rules, DDoS protection,
      capacity management records.

  - id: "SC-5(2)"
    title: "Denial of Service Protection — Capacity, Bandwidth, and Redundancy"
    section: "System and Communications Protection"
    description: >
      Manage capacity, bandwidth, or other redundancy to limit
      the effects of information flooding denial of service attacks.
    implementation_guidance: >
      Evidence: Auto-scaling configuration, bandwidth management,
      redundancy architecture documentation.

  - id: "SC-7"
    title: "Boundary Protection"
    section: "System and Communications Protection"
    description: >
      Monitor and control communications at the external boundary
      and at key internal boundaries; implement subnetworks for
      publicly accessible system components that are physically
      or logically separated.
    implementation_guidance: >
      Evidence: VPC configuration, security group rules, SonicWall
      firewall, network segmentation, subnet architecture.

  - id: "SC-7(3)"
    title: "Boundary Protection — Access Points"
    section: "System and Communications Protection"
    description: >
      Limit the number of external network connections to the system.
    implementation_guidance: >
      Evidence: Network access point inventory, limited egress/ingress
      points documentation, VPC gateway configuration.

  - id: "SC-7(4)"
    title: "Boundary Protection — External Telecommunications Services"
    section: "System and Communications Protection"
    description: >
      Implement a managed interface for each external
      telecommunications service; establish a traffic flow
      policy; document exceptions to the traffic flow policy.
    implementation_guidance: >
      Evidence: External telecom connection documentation, traffic
      flow policies, managed interface configuration.

  - id: "SC-7(5)"
    title: "Boundary Protection — Deny by Default — Allow by Exception"
    section: "System and Communications Protection"
    description: >
      Deny network communications traffic by default and allow
      network communications traffic by exception.
    implementation_guidance: >
      Evidence: Default deny firewall configuration, SonicWall
      deny-by-default rules, allowlist-based network access controls.

  - id: "SC-7(7)"
    title: "Boundary Protection — Split Tunneling for Remote Devices"
    section: "System and Communications Protection"
    description: >
      Prevent split tunneling for remote devices connecting to
      organizational systems unless the split tunnel is securely
      provisioned using defined safeguards.
    implementation_guidance: >
      Evidence: VPN split tunneling policy and configuration,
      remote access tunnel configuration.

  - id: "SC-7(8)"
    title: "Boundary Protection — Route Traffic to Authenticated Proxy Servers"
    section: "System and Communications Protection"
    description: >
      Route defined internal communications traffic to defined
      external networks through authenticated proxy servers at
      managed interfaces.
    implementation_guidance: >
      Evidence: Proxy server configuration, traffic routing through
      authenticated proxies, web filtering configuration.

  - id: "SC-7(18)"
    title: "Boundary Protection — Fail Secure"
    section: "System and Communications Protection"
    description: >
      Prevent systems from entering unsecure states in the event
      of an operational failure of a boundary protection device.
    implementation_guidance: >
      Evidence: Fail-secure configuration for boundary devices,
      firewall failure mode configuration.

  - id: "SC-7(21)"
    title: "Boundary Protection — Isolation of System Components"
    section: "System and Communications Protection"
    description: >
      Employ boundary protection mechanisms to isolate defined
      system components supporting defined missions or business
      functions.
    implementation_guidance: >
      Evidence: Component isolation architecture, VPC subnet
      isolation, security group isolation for sensitive components.

  - id: "SC-7(25)"
    title: "Boundary Protection — Unclassified National Security System Connections"
    section: "System and Communications Protection"
    description: >
      Prohibit the direct connection of an unclassified national
      security system to an external network without the use of
      a defined boundary protection device.
    implementation_guidance: >
      Evidence: Connection restrictions for NSS, boundary device
      configuration for any NSS connections.

  - id: "SC-7(26)"
    title: "Boundary Protection — Classified National Security System Connections"
    section: "System and Communications Protection"
    description: >
      Prohibit the direct connection of a classified national
      security system to an external network without the use of
      a defined boundary protection device.
    implementation_guidance: >
      Evidence: Classified system connection controls if applicable.

  - id: "SC-7(27)"
    title: "Boundary Protection — Restrictions on Connections to Non-Organizationally Owned Networks"
    section: "System and Communications Protection"
    description: >
      Restrict connections from the system to non-organizationally
      owned or operated networks through defined methods.
    implementation_guidance: >
      Evidence: Network access restrictions, external network
      connection policy, Intune conditional access for non-corporate
      networks.

  - id: "SC-7(28)"
    title: "Boundary Protection — Connections to Public Networks"
    section: "System and Communications Protection"
    description: >
      Prohibit the direct connection of defined systems to public
      networks.
    implementation_guidance: >
      Evidence: Public network connection restrictions, VPC internet
      gateway controls, direct public network access prohibitions.

  - id: "SC-8"
    title: "Transmission Confidentiality and Integrity"
    section: "System and Communications Protection"
    description: >
      Implement cryptographic mechanisms to prevent unauthorized
      disclosure of information and detect changes to information
      during transmission.
    implementation_guidance: >
      Evidence: TLS certificate inventory, encryption in transit
      policy, HTTPS enforcement.

  - id: "SC-8(1)"
    title: "Transmission Confidentiality and Integrity — Cryptographic Protection"
    section: "System and Communications Protection"
    description: >
      Implement cryptographic mechanisms to prevent unauthorized
      disclosure of information and detect changes to information
      during transmission.
    implementation_guidance: >
      Evidence: TLS/SSL configuration, cryptographic protection
      implementation, encryption standards documentation.

  - id: "SC-10"
    title: "Network Disconnect"
    section: "System and Communications Protection"
    description: >
      Terminate the network connection associated with a communications
      session at the end of the session or after a defined period
      of inactivity.
    implementation_guidance: >
      Evidence: Network session timeout configuration, connection
      termination policies.

  - id: "SC-12"
    title: "Cryptographic Key Establishment and Management"
    section: "System and Communications Protection"
    description: >
      Establish and manage cryptographic keys when cryptography
      is employed within the system.
    implementation_guidance: >
      Evidence: AWS KMS configuration, key management policy,
      key rotation configuration, KMS customer managed keys.

  - id: "SC-12(1)"
    title: "Cryptographic Key Establishment and Management — Availability"
    section: "System and Communications Protection"
    description: >
      Maintain availability of information in the event of the
      loss of cryptographic keys by users.
    implementation_guidance: >
      Evidence: Key recovery procedures, key escrow documentation,
      key availability planning.

  - id: "SC-13"
    title: "Cryptographic Protection"
    section: "System and Communications Protection"
    description: >
      Implement the following types of cryptography required for
      each specified cryptographic use in accordance with applicable
      laws and regulations.
    implementation_guidance: >
      Evidence: Encryption policy, FIPS 140-2 validation documentation,
      cryptographic standards, AWS encryption configuration.

  - id: "SC-15"
    title: "Collaborative Computing Devices and Applications"
    section: "System and Communications Protection"
    description: >
      Prohibit remote activation of collaborative computing devices
      and applications except for defined exceptions; provide an
      explicit indication of use to users physically present.
    implementation_guidance: >
      Evidence: Collaborative tool policy, remote activation restrictions,
      conferencing security configuration.

  - id: "SC-17"
    title: "Public Key Infrastructure Certificates"
    section: "System and Communications Protection"
    description: >
      Issue public key certificates under an appropriate certificate
      policy or obtain public key certificates from an approved
      service provider.
    implementation_guidance: >
      Evidence: Certificate management policy, CA authorization,
      certificate inventory and lifecycle management.

  - id: "SC-18"
    title: "Mobile Code"
    section: "System and Communications Protection"
    description: >
      Define acceptable and unacceptable mobile code and technologies;
      authorize, monitor, and control use of mobile code.
    implementation_guidance: >
      Evidence: Mobile code policy, browser security configuration,
      application control policies.

  - id: "SC-19"
    title: "Voice over Internet Protocol"
    section: "System and Communications Protection"
    description: >
      Establish usage restrictions and implementation guidelines
      for VoIP based on the potential to cause damage.
    implementation_guidance: >
      Evidence: VoIP policy, 3CX security configuration, VoIP
      security documentation.

  - id: "SC-20"
    title: "Secure Name/Address Resolution Service — Authoritative Source"
    section: "System and Communications Protection"
    description: >
      Provide additional data origin authentication and integrity
      verification artifacts along with authoritative name
      resolution data.
    implementation_guidance: >
      Evidence: DNSSEC configuration, DNS security settings,
      Route 53 configuration.

  - id: "SC-21"
    title: "Secure Name/Address Resolution Service — Recursive or Caching Resolver"
    section: "System and Communications Protection"
    description: >
      Request and perform data origin authentication and data
      integrity verification on name/address resolution responses
      from authoritative sources.
    implementation_guidance: >
      Evidence: DNS resolver security configuration, DNSSEC
      validation settings.

  - id: "SC-22"
    title: "Architecture and Provisioning for Name/Address Resolution Service"
    section: "System and Communications Protection"
    description: >
      Ensure systems providing name/address resolution are
      fault-tolerant and implement internal and external role
      separation.
    implementation_guidance: >
      Evidence: DNS architecture, redundant DNS configuration,
      Route 53 health checks.

  - id: "SC-23"
    title: "Session Authenticity"
    section: "System and Communications Protection"
    description: >
      Protect the authenticity of communications sessions.
    implementation_guidance: >
      Evidence: TLS configuration, session token security,
      anti-CSRF controls.

  - id: "SC-24"
    title: "Fail in Known State"
    section: "System and Communications Protection"
    description: >
      Fail to a defined known state for defined types of failures
      while preserving system state information in failure.
    implementation_guidance: >
      Evidence: Fail-safe design documentation, known-state failure
      configuration, system failure response procedures.

  - id: "SC-26"
    title: "Decoys"
    section: "System and Communications Protection"
    description: >
      Include components within organizational systems specifically
      designed to be the target of malicious attacks for the purpose
      of detecting, deflecting, and analyzing such attacks.
    implementation_guidance: >
      Evidence: Honeypot or deception technology deployment records
      if applicable, threat detection mechanisms.

  - id: "SC-28"
    title: "Protection of Information at Rest"
    section: "System and Communications Protection"
    description: >
      Implement cryptographic mechanisms to prevent unauthorized
      disclosure and modification of information at rest.
    implementation_guidance: >
      Evidence: Encryption at rest policy, AWS EBS encryption,
      S3 encryption, KMS records, database encryption.

  - id: "SC-28(1)"
    title: "Protection of Information at Rest — Cryptographic Protection"
    section: "System and Communications Protection"
    description: >
      Implement cryptographic mechanisms to prevent unauthorized
      disclosure and modification of defined information at rest
      on defined system components.
    implementation_guidance: >
      Evidence: Specific encryption-at-rest implementation evidence,
      KMS key usage, encrypted storage configuration.

  - id: "SC-39"
    title: "Process Isolation"
    section: "System and Communications Protection"
    description: >
      Maintain a separate execution domain for each executing process.
    implementation_guidance: >
      Evidence: Container isolation documentation, process isolation
      architecture, AWS account separation.

  - id: "SC-45"
    title: "System Time Synchronization"
    section: "System and Communications Protection"
    description: >
      Synchronize system clocks within and between systems and
      system components.
    implementation_guidance: >
      Evidence: NTP configuration, clock synchronization policy,
      AWS time synchronization documentation.

  - id: "SC-45(1)"
    title: "System Time Synchronization — Synchronization with Authoritative Time Source"
    section: "System and Communications Protection"
    description: >
      Synchronize system clocks with authoritative time sources
      at defined frequencies.
    implementation_guidance: >
      Evidence: NTP authoritative source configuration, AWS
      time synchronization with authoritative sources.

  - id: "SC-49"
    title: "Hardware-Based Protection"
    section: "System and Communications Protection"
    description: >
      Implement hardware-based, write-protect for defined system
      firmware.
    implementation_guidance: >
      Evidence: Hardware-based protection documentation, firmware
      protection mechanisms.

  - id: "SC-51"
    title: "Hardware-Based Authentication"
    section: "System and Communications Protection"
    description: >
      Support organization-required or individual-required hardware
      authentication of defined systems, system components, or devices.
    implementation_guidance: >
      Evidence: Hardware-based authentication implementation,
      FIDO2 hardware key documentation if applicable.

  # ═══════════════════════════════════════════════════════════════════════════
  # SI — SYSTEM AND INFORMATION INTEGRITY
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "SI-1"
    title: "System and Information Integrity Policy and Procedures"
    section: "System and Information Integrity"
    description: >
      Develop, document, and disseminate a system and information
      integrity policy and procedures; review and update at
      defined frequencies.
    implementation_guidance: >
      Evidence: System and information integrity policy, procedures,
      policy review records.

  - id: "SI-2"
    title: "Flaw Remediation"
    section: "System and Information Integrity"
    description: >
      Identify, report, and correct system flaws; test software
      updates for effectiveness before installation; install
      security-relevant software updates within defined time periods.
    implementation_guidance: >
      Evidence: Patch compliance report, vulnerability remediation
      records, patch management policy, patch SLA documentation.

  - id: "SI-2(2)"
    title: "Flaw Remediation — Automated Flaw Remediation Status"
    section: "System and Information Integrity"
    description: >
      Determine if system components have applicable security-relevant
      software patches installed using automated mechanisms at defined
      frequency.
    implementation_guidance: >
      Evidence: Automated patch status reporting, CrowdStrike patch
      compliance, Intune patch compliance reports.

  - id: "SI-2(3)"
    title: "Flaw Remediation — Time to Remediate Flaws and Benchmarks for Corrective Actions"
    section: "System and Information Integrity"
    description: >
      Measure the time between flaw identification and flaw
      remediation; establish benchmarks for taking corrective
      actions.
    implementation_guidance: >
      Evidence: Patch SLA documentation, time-to-patch metrics,
      vulnerability remediation time tracking.

  - id: "SI-3"
    title: "Malicious Code Protection"
    section: "System and Information Integrity"
    description: >
      Implement malicious code protection at system entry/exit
      points and at workstations, servers, and mobile devices
      to detect and eradicate malicious code.
    implementation_guidance: >
      Evidence: CrowdStrike Falcon sensor coverage report,
      anti-malware policy, endpoint protection configuration.

  - id: "SI-3(1)"
    title: "Malicious Code Protection — Central Management"
    section: "System and Information Integrity"
    description: >
      Centrally manage malicious code protection mechanisms.
    implementation_guidance: >
      Evidence: Centralized CrowdStrike management, central AV
      management console, centralized endpoint protection records.

  - id: "SI-3(2)"
    title: "Malicious Code Protection — Automatic Updates"
    section: "System and Information Integrity"
    description: >
      Automatically update malicious code protection mechanisms.
    implementation_guidance: >
      Evidence: Automatic signature update configuration, CrowdStrike
      automatic update settings, AV definition update records.

  - id: "SI-3(10)"
    title: "Malicious Code Protection — Malicious Code Analysis"
    section: "System and Information Integrity"
    description: >
      Employ the following tools and techniques to analyze the
      characteristics and behavior of malicious code and incorporate
      the results into the organizational incident response and flaw
      remediation processes.
    implementation_guidance: >
      Evidence: Malware analysis procedures, CrowdStrike behavioral
      analysis, malicious code analysis integration with IR.

  - id: "SI-4"
    title: "System Monitoring"
    section: "System and Information Integrity"
    description: >
      Monitor the system to detect attacks and indicators of potential
      attacks; identify unauthorized use; deploy monitoring devices
      strategically.
    implementation_guidance: >
      Evidence: Security Hub monitoring, CrowdStrike monitoring,
      CloudWatch alarms, monitoring activities policy.

  - id: "SI-4(1)"
    title: "System Monitoring — System-Wide Intrusion Detection System"
    section: "System and Information Integrity"
    description: >
      Connect and configure individual intrusion detection tools
      into a system-wide intrusion detection system.
    implementation_guidance: >
      Evidence: Centralized IDS/IPS configuration, Security Hub
      integration with monitoring tools, system-wide monitoring
      architecture.

  - id: "SI-4(2)"
    title: "System Monitoring — Automated Tools and Mechanisms for Real-Time Analysis"
    section: "System and Information Integrity"
    description: >
      Employ automated tools and mechanisms to support near real-time
      analysis of events.
    implementation_guidance: >
      Evidence: Real-time monitoring configuration, CrowdStrike real-time
      detection, Security Hub real-time analysis.

  - id: "SI-4(4)"
    title: "System Monitoring — Inbound and Outbound Communications Traffic"
    section: "System and Information Integrity"
    description: >
      Determine if inbound or outbound communications traffic contains
      unusual or unauthorized activities or conditions at external
      boundaries and at selected interior points.
    implementation_guidance: >
      Evidence: Network traffic analysis, VPC flow logs, firewall
      traffic monitoring, anomaly detection configuration.

  - id: "SI-4(5)"
    title: "System Monitoring — System-Generated Alerts"
    section: "System and Information Integrity"
    description: >
      Alert defined personnel or roles when defined compromise
      indicators or potential indicators of compromise occur.
    implementation_guidance: >
      Evidence: Security alerting configuration, CrowdStrike alerts,
      Security Hub findings notifications, alert recipient configuration.

  - id: "SI-4(10)"
    title: "System Monitoring — Visibility of Encrypted Communications"
    section: "System and Information Integrity"
    description: >
      Make provisions so that defined encrypted communications traffic
      is visible to defined system monitoring tools.
    implementation_guidance: >
      Evidence: TLS inspection or visibility procedures, encrypted
      traffic monitoring approach documentation.

  - id: "SI-4(12)"
    title: "System Monitoring — Automated Organization-Generated Alerts"
    section: "System and Information Integrity"
    description: >
      Alert defined personnel using automated mechanisms when the
      following indicators of inappropriate or unusual activities
      with security or privacy implications occur.
    implementation_guidance: >
      Evidence: Automated alerting for security events, SIEM alert
      configuration, automated notification procedures.

  - id: "SI-4(14)"
    title: "System Monitoring — Wireless Intrusion Detection"
    section: "System and Information Integrity"
    description: >
      Employ a wireless intrusion detection system to identify
      rogue wireless devices and detect attack attempts and potential
      compromises to the system.
    implementation_guidance: >
      Evidence: Wireless IDS configuration, rogue AP detection
      procedures, wireless monitoring evidence.

  - id: "SI-4(20)"
    title: "System Monitoring — Privileged Users"
    section: "System and Information Integrity"
    description: >
      Implement defined additional monitoring for privileged users.
    implementation_guidance: >
      Evidence: Privileged user activity monitoring, admin activity
      logs review procedures, enhanced monitoring for privileged accounts.

  - id: "SI-4(22)"
    title: "System Monitoring — Unauthorized Network Services"
    section: "System and Information Integrity"
    description: >
      Detect network services that have not been authorized or
      approved and notify defined personnel or roles.
    implementation_guidance: >
      Evidence: Unauthorized service detection procedures, port
      scanning for unauthorized services, network service inventory
      monitoring.

  - id: "SI-4(23)"
    title: "System Monitoring — Host-Based Devices"
    section: "System and Information Integrity"
    description: >
      Implement defined host-based monitoring mechanisms at defined
      system components.
    implementation_guidance: >
      Evidence: CrowdStrike host-based monitoring, NinjaOne
      host monitoring, Intune device monitoring.

  - id: "SI-5"
    title: "Security Alerts, Advisories, and Directives"
    section: "System and Information Integrity"
    description: >
      Receive security alerts, advisories, and directives from
      defined external organizations on an ongoing basis; generate
      internal alerts; disseminate alerts to defined personnel.
    implementation_guidance: >
      Evidence: Threat intelligence policy, security advisory
      subscriptions, alert dissemination procedures.

  - id: "SI-6"
    title: "Security and Privacy Function Verification"
    section: "System and Information Integrity"
    description: >
      Verify the correct operation of defined security and privacy
      functions; perform verification at defined system states.
    implementation_guidance: >
      Evidence: Security function testing records, control validation,
      AWS Config compliance evidence.

  - id: "SI-7"
    title: "Software, Firmware, and Information Integrity"
    section: "System and Information Integrity"
    description: >
      Employ integrity verification tools to detect unauthorized
      changes to defined software, firmware, and information.
    implementation_guidance: >
      Evidence: File integrity monitoring, CloudTrail log validation,
      integrity checking tool records.

  - id: "SI-7(1)"
    title: "Software, Firmware, and Information Integrity — Integrity Checks"
    section: "System and Information Integrity"
    description: >
      Perform an integrity check of defined software, firmware, and
      information at defined transition states or security-relevant
      events.
    implementation_guidance: >
      Evidence: Integrity check procedures, automated integrity
      verification, integrity check results.

  - id: "SI-7(7)"
    title: "Software, Firmware, and Information Integrity — Integration of Detection and Response"
    section: "System and Information Integrity"
    description: >
      Incorporate the detection of unauthorized changes to software
      and firmware into the organizational incident response capability.
    implementation_guidance: >
      Evidence: Integrity violation incident response procedures,
      integration of FIM alerts with IR processes.

  - id: "SI-7(15)"
    title: "Software, Firmware, and Information Integrity — Code Authentication"
    section: "System and Information Integrity"
    description: >
      Implement cryptographic mechanisms to authenticate the following
      software or firmware components prior to installation.
    implementation_guidance: >
      Evidence: Code signing verification procedures, cryptographic
      authentication of software before installation.

  - id: "SI-8"
    title: "Spam Protection"
    section: "System and Information Integrity"
    description: >
      Implement spam protection mechanisms at entry and exit points;
      update mechanisms when new releases are available.
    implementation_guidance: >
      Evidence: Email spam filtering, anti-phishing controls,
      M365 spam protection settings.

  - id: "SI-8(1)"
    title: "Spam Protection — Central Management"
    section: "System and Information Integrity"
    description: >
      Centrally manage spam protection mechanisms.
    implementation_guidance: >
      Evidence: Centralized email security management, M365
      centralized anti-spam configuration.

  - id: "SI-8(2)"
    title: "Spam Protection — Automatic Updates"
    section: "System and Information Integrity"
    description: >
      Automatically update spam protection mechanisms.
    implementation_guidance: >
      Evidence: Automatic spam filter update configuration,
      M365 automatic threat intelligence updates.

  - id: "SI-10"
    title: "Information Input Validation"
    section: "System and Information Integrity"
    description: >
      Check the validity of defined information inputs.
    implementation_guidance: >
      Evidence: Application security requirements, input validation
      procedures, secure coding standards.

  - id: "SI-11"
    title: "Error Handling"
    section: "System and Information Integrity"
    description: >
      Generate error messages providing information for corrective
      actions without revealing information that could be exploited;
      reveal error messages only to defined personnel.
    implementation_guidance: >
      Evidence: Error handling standards, application security
      requirements, error message review.

  - id: "SI-12"
    title: "Information Management and Retention"
    section: "System and Information Integrity"
    description: >
      Manage and retain information within the system and information
      output in accordance with applicable laws and operational
      requirements.
    implementation_guidance: >
      Evidence: Records retention policy, information management
      procedures, data deletion records.

  - id: "SI-16"
    title: "Memory Protection"
    section: "System and Information Integrity"
    description: >
      Implement controls to protect system memory from unauthorized
      code execution.
    implementation_guidance: >
      Evidence: OS memory protection configuration, DEP/ASLR settings,
      endpoint security configuration.

  - id: "SI-19"
    title: "De-Identification"
    section: "System and Information Integrity"
    description: >
      Remove the following elements of personally identifiable
      information from datasets to reduce the level of privacy
      risk.
    implementation_guidance: >
      Evidence: De-identification policy, data masking procedures,
      PHI de-identification documentation.

  - id: "SI-19(1)"
    title: "De-Identification — Collection"
    section: "System and Information Integrity"
    description: >
      De-identify the dataset upon collection by not collecting
      elements that create a direct link to an individual.
    implementation_guidance: >
      Evidence: Data collection minimization procedures, PII
      reduction at collection, de-identification at collection
      evidence.

  # ═══════════════════════════════════════════════════════════════════════════
  # SR — SUPPLY CHAIN RISK MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "SR-1"
    title: "Supply Chain Risk Management Policy and Procedures"
    section: "Supply Chain Risk Management"
    description: >
      Develop, document, and disseminate a supply chain risk
      management policy and procedures; review and update at
      defined frequencies.
    implementation_guidance: >
      Evidence: Supply chain risk management policy, SCRM procedures,
      policy review records.

  - id: "SR-2"
    title: "Supply Chain Risk Management Plan"
    section: "Supply Chain Risk Management"
    description: >
      Develop a plan for managing supply chain risks associated with
      the research and development, design, manufacturing, acquisition,
      delivery, integration, operations, maintenance, and disposal
      of systems.
    implementation_guidance: >
      Evidence: Supply chain risk management plan, supplier risk
      assessment procedures, SCRM governance documentation.

  - id: "SR-2(1)"
    title: "Supply Chain Risk Management Plan — Establish SCRM Team"
    section: "Supply Chain Risk Management"
    description: >
      Establish a supply chain risk management team consisting of
      defined personnel that include an information security professional
      and other defined personnel.
    implementation_guidance: >
      Evidence: SCRM team designation, team charter, SCRM team
      membership records.

  - id: "SR-3"
    title: "Supply Chain Controls and Processes"
    section: "Supply Chain Risk Management"
    description: >
      Establish a process or processes to identify and address
      weaknesses or deficiencies in the supply chain elements and
      processes of defined systems; employ defined controls to protect
      against supply chain risks.
    implementation_guidance: >
      Evidence: Supply chain controls documentation, supplier
      security review matrix, supply chain weakness tracking.

  - id: "SR-5"
    title: "Acquisition Strategies, Tools, and Methods"
    section: "Supply Chain Risk Management"
    description: >
      Employ defined acquisition strategies, contract tools, and
      procurement methods to protect against, identify, and mitigate
      supply chain risks.
    implementation_guidance: >
      Evidence: Acquisition strategy documentation, procurement
      procedures with SCRM requirements, contract clauses for
      supply chain risk.

  - id: "SR-6"
    title: "Supplier Assessments and Reviews"
    section: "Supply Chain Risk Management"
    description: >
      Assess and review the supply chain-related risks associated
      with suppliers and the products and services they provide.
    implementation_guidance: >
      Evidence: Supplier security review matrix, third-party risk
      assessments, supplier audit records.

  - id: "SR-8"
    title: "Notification Agreements"
    section: "Supply Chain Risk Management"
    description: >
      Establish agreements and procedures with entities involved in
      the supply chain to notify the organization using defined
      mechanisms.
    implementation_guidance: >
      Evidence: Supplier notification agreements, incident notification
      clauses in vendor contracts.

  - id: "SR-9"
    title: "Tamper Resistance and Detection"
    section: "Supply Chain Risk Management"
    description: >
      Implement a tamper protection program for the system, system
      component, or system service.
    implementation_guidance: >
      Evidence: Tamper detection procedures, hardware tamper
      protection documentation.

  - id: "SR-9(1)"
    title: "Tamper Resistance and Detection — Multiple Stages of SDLC"
    section: "Supply Chain Risk Management"
    description: >
      Employ anti-tamper technologies, tools, and techniques
      throughout the system development life cycle.
    implementation_guidance: >
      Evidence: Anti-tamper controls throughout SDLC, code
      signing, integrity verification at each SDLC stage.

  - id: "SR-10"
    title: "Inspection of Systems or Components"
    section: "Supply Chain Risk Management"
    description: >
      Inspect the following systems or system components to detect
      tampering at defined locations using defined inspection
      techniques.
    implementation_guidance: >
      Evidence: System inspection procedures, hardware inspection
      records, component verification documentation.

  - id: "SR-11"
    title: "Component Authenticity"
    section: "Supply Chain Risk Management"
    description: >
      Develop and implement anti-counterfeit policy and procedures
      that include the means to detect and prevent counterfeit
      components from entering the system.
    implementation_guidance: >
      Evidence: Anti-counterfeit policy, component authenticity
      verification procedures.

  - id: "SR-11(1)"
    title: "Component Authenticity — Anti-Counterfeit Training"
    section: "Supply Chain Risk Management"
    description: >
      Train defined personnel in how to detect counterfeit
      system components including hardware, software, and firmware.
    implementation_guidance: >
      Evidence: Anti-counterfeit training records, training
      curriculum for procurement personnel.

  - id: "SR-11(2)"
    title: "Component Authenticity — Configuration Control for Component Service and Repair"
    section: "Supply Chain Risk Management"
    description: >
      Maintain configuration control over defined system components
      awaiting service or repair and serviced or repaired components
      awaiting return to service.
    implementation_guidance: >
      Evidence: Component service configuration control procedures,
      repair chain of custody records.

  - id: "SR-12"
    title: "Component Disposal"
    section: "Supply Chain Risk Management"
    description: >
      Dispose of components using defined techniques and methods.
    implementation_guidance: >
      Evidence: Component disposal policy, media sanitization and
      disposal records, secure disposal procedures.

  # ═══════════════════════════════════════════════════════════════════════════
  # PM — PROGRAM MANAGEMENT
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "PM-1"
    title: "Information Security Program Plan"
    section: "Program Management"
    description: >
      Develop and disseminate an organization-wide information security
      and privacy program plan providing an overview of requirements
      and description of program management controls.
    implementation_guidance: >
      Evidence: Information security program plan, ISMS scope document,
      program overview documentation.

  - id: "PM-2"
    title: "Information Security Program Leadership Roles"
    section: "Program Management"
    description: >
      Appoint a senior agency information security officer with
      mission and resources to coordinate, develop, implement,
      and maintain an organization-wide information security program.
    implementation_guidance: >
      Evidence: CISO appointment documentation, roles and responsibilities,
      organizational chart showing security leadership.

  - id: "PM-3"
    title: "Information Security and Privacy Resources"
    section: "Program Management"
    description: >
      Include security and privacy resources in capital planning;
      document exceptions; ensure resources are available for
      expenditure as planned.
    implementation_guidance: >
      Evidence: Security budget allocation, resource planning records,
      IS objectives and KPI documentation.

  - id: "PM-4"
    title: "Plan of Action and Milestones Process"
    section: "Program Management"
    description: >
      Implement a process to ensure that plans of action and milestones
      for security and privacy programs are maintained; reported in
      accordance with FISMA reporting requirements; reviewed.
    implementation_guidance: >
      Evidence: POA&M process documentation, POA&M tracking records,
      management review of POA&M items.

  - id: "PM-5"
    title: "System Inventory"
    section: "Program Management"
    description: >
      Develop and maintain an inventory of organizational systems.
    implementation_guidance: >
      Evidence: System inventory, asset register, authorized system
      list, ISMS scope documentation.

  - id: "PM-6"
    title: "Measures of Performance"
    section: "Program Management"
    description: >
      Develop, monitor, and report on the results of information
      security and privacy measures of performance.
    implementation_guidance: >
      Evidence: IS performance KPIs, security metrics reports,
      management review KPI tracking.

  - id: "PM-7"
    title: "Enterprise Architecture"
    section: "Program Management"
    description: >
      Develop an enterprise architecture with considerations for
      information security and privacy.
    implementation_guidance: >
      Evidence: Enterprise architecture documentation, security
      architecture integrated with EA, architecture review records.

  - id: "PM-8"
    title: "Critical Infrastructure Plan"
    section: "Program Management"
    description: >
      Address information security and privacy issues in the
      development, documentation, and updating of a critical
      infrastructure and key resources protection plan.
    implementation_guidance: >
      Evidence: Critical infrastructure protection plan, key
      resource identification, infrastructure protection documentation.

  - id: "PM-9"
    title: "Risk Management Strategy"
    section: "Program Management"
    description: >
      Develop a comprehensive strategy to manage and accept
      organizational security and privacy risk.
    implementation_guidance: >
      Evidence: Risk management strategy, risk treatment plan,
      IS risk register, organizational risk tolerance documentation.

  - id: "PM-10"
    title: "Authorization Process"
    section: "Program Management"
    description: >
      Manage the security and privacy state of organizational
      systems through authorization processes.
    implementation_guidance: >
      Evidence: Authorization process documentation, ATO package,
      continuous authorization procedures.

  - id: "PM-11"
    title: "Mission and Business Process Definition"
    section: "Program Management"
    description: >
      Define organizational mission and business processes with
      consideration for security and privacy and the resulting
      risk to organizational operations.
    implementation_guidance: >
      Evidence: Business process documentation, IS risk considerations
      in planning, ISMS scope and context documentation.

  - id: "PM-12"
    title: "Insider Threat Program"
    section: "Program Management"
    description: >
      Implement an insider threat program that includes a
      cross-discipline insider threat incident handling team.
    implementation_guidance: >
      Evidence: Insider threat program documentation, insider threat
      team composition, insider threat detection procedures.

  - id: "PM-13"
    title: "Security and Privacy Workforce"
    section: "Program Management"
    description: >
      Establish a security and privacy workforce development and
      improvement program.
    implementation_guidance: >
      Evidence: Security workforce development program, training
      and certification plans for security staff.

  - id: "PM-14"
    title: "Testing, Training, and Monitoring"
    section: "Program Management"
    description: >
      Implement a process for ensuring that organizational plans
      for conducting security and privacy testing, training, and
      monitoring activities are developed and maintained.
    implementation_guidance: >
      Evidence: Security testing schedule, training plan,
      continuous monitoring plan, audit program.

  - id: "PM-15"
    title: "Security and Privacy Groups and Associations"
    section: "Program Management"
    description: >
      Establish and institutionalize contact with security and
      privacy community groups and associations.
    implementation_guidance: >
      Evidence: Contact with special interest groups policy,
      security community membership, threat intelligence subscriptions.

  - id: "PM-16"
    title: "Threat Awareness Program"
    section: "Program Management"
    description: >
      Implement a threat awareness program including a
      cross-organization information-sharing capability for
      threat intelligence.
    implementation_guidance: >
      Evidence: Threat intelligence policy, threat feeds,
      threat sharing procedures, threat awareness program.

  - id: "PM-17"
    title: "Protecting Controlled Unclassified Information"
    section: "Program Management"
    description: >
      Establish a process for identifying and implementing the
      required controls for the protection of CUI.
    implementation_guidance: >
      Evidence: CUI identification process, CUI handling procedures,
      CMMC controls for CUI protection.

  - id: "PM-18"
    title: "Privacy Program Plan"
    section: "Program Management"
    description: >
      Develop and disseminate an organization-wide privacy program
      plan providing an overview of the agency's privacy program.
    implementation_guidance: >
      Evidence: Privacy program plan, privacy governance documentation,
      privacy officer designation.

  - id: "PM-19"
    title: "Privacy Program Leadership Roles"
    section: "Program Management"
    description: >
      Appoint a senior agency official for privacy with responsibility
      for developing, implementing, and maintaining an organization-wide
      privacy program.
    implementation_guidance: >
      Evidence: Privacy officer appointment, privacy leadership
      designation, privacy program governance.

  - id: "PM-20"
    title: "Dissemination of Privacy Program Information"
    section: "Program Management"
    description: >
      Maintain a central resource webpage on the organization's
      principal public website; maintain an inventory of the
      organization's systems.
    implementation_guidance: >
      Evidence: Privacy program information dissemination, public
      privacy resources, privacy webpage documentation.

  - id: "PM-21"
    title: "Accounting of Disclosures"
    section: "Program Management"
    description: >
      Develop and maintain an accurate accounting of disclosures
      of personally identifiable information; retain accounting
      of disclosures for a defined period.
    implementation_guidance: >
      Evidence: PII disclosure accounting records, disclosure
      tracking procedures, retention records for disclosures.

  - id: "PM-22"
    title: "Personally Identifiable Information Quality Management"
    section: "Program Management"
    description: >
      Enhance the quality of PII used for decisions about
      individuals by establishing and implementing defined
      policies and procedures.
    implementation_guidance: >
      Evidence: PII quality management procedures, data accuracy
      verification, PII correction procedures.

  - id: "PM-23"
    title: "Data Governance Body"
    section: "Program Management"
    description: >
      Establish a data governance body consisting of defined
      roles with defined responsibilities.
    implementation_guidance: >
      Evidence: Data governance body charter, data governance
      membership, data governance meeting records.

  - id: "PM-24"
    title: "Data Integrity Board"
    section: "Program Management"
    description: >
      Establish a Data Integrity Board to oversee organizational
      Computer Matching Programs and to ensure compliance with
      applicable requirements.
    implementation_guidance: >
      Evidence: Data Integrity Board documentation if applicable
      under Privacy Act, computer matching agreements.

  - id: "PM-25"
    title: "Minimization of Personally Identifiable Information Used in Testing, Training, and Research"
    section: "Program Management"
    description: >
      Develop, document, and implement policies and procedures
      that address the use of PII for internal testing, training,
      and research.
    implementation_guidance: >
      Evidence: Test data policy, PII minimization in test environments,
      data masking procedures for non-production environments.

  - id: "PM-26"
    title: "Complaint Management"
    section: "Program Management"
    description: >
      Implement a process for receiving and responding to complaints
      or concerns from individuals about the organizational privacy
      practices.
    implementation_guidance: >
      Evidence: Privacy complaint process, complaint tracking records,
      complaint response procedures.

  - id: "PM-27"
    title: "Privacy Reporting"
    section: "Program Management"
    description: >
      Develop and report to defined officials defined privacy reports
      at a defined frequency.
    implementation_guidance: >
      Evidence: Privacy reporting procedures, privacy reports to
      leadership, privacy metrics documentation.

  - id: "PM-28"
    title: "Risk Framing"
    section: "Program Management"
    description: >
      Identify and document the assumptions, constraints, risk
      tolerances, and priorities and trade-offs used for making
      investment and operational decisions.
    implementation_guidance: >
      Evidence: Risk tolerance documentation, risk framing
      assumptions, investment decision criteria.

  - id: "PM-29"
    title: "Risk Management Program Leadership Roles"
    section: "Program Management"
    description: >
      Appoint a risk executive function to coordinate risk management
      across the organization.
    implementation_guidance: >
      Evidence: Risk executive designation, risk management
      governance structure.

  - id: "PM-30"
    title: "Supply Chain Risk Management Strategy"
    section: "Program Management"
    description: >
      Develop an organization-wide strategy for managing supply
      chain risks associated with the development, acquisition,
      maintenance, and disposal of systems.
    implementation_guidance: >
      Evidence: Supply chain risk management strategy, SCRM
      governance documentation.

  - id: "PM-31"
    title: "Continuous Monitoring Strategy"
    section: "Program Management"
    description: >
      Develop an organization-wide continuous monitoring strategy
      and implement continuous monitoring in accordance with the
      strategy.
    implementation_guidance: >
      Evidence: Continuous monitoring strategy documentation,
      organization-wide monitoring program.

  - id: "PM-32"
    title: "Purposing"
    section: "Program Management"
    description: >
      Analyze defined systems or systems components supporting
      defined mission or business functions to evaluate the impact
      of the loss of the resource on organizational operations.
    implementation_guidance: >
      Evidence: Mission criticality analysis, system purposing
      documentation, business impact analysis.
