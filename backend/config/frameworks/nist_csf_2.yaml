# NIST CSF 2.0 — category-level catalog (22 categories, CSF.*.* IDs).
# This is NOT full outcome-level coverage (~108 subcategory outcomes in the
# published CSF 2.0 Core). Gap analysis against this file is category-grain only.

framework:
  name: "NIST Cybersecurity Framework 2.0"
  short_name: "nist_csf_2"
  version: "2.0"
  description: >
    NIST Cybersecurity Framework 2.0 core functions and categories
    (category-level; not full outcome-subcategory coverage).

controls:
  - id: "CSF.GV.OC"
    title: "Organizational Context"
    section: "GOVERN"
    description: "Organizational context is understood and informs cybersecurity risk management."
  - id: "CSF.GV.RM"
    title: "Risk Management Strategy"
    section: "GOVERN"
    description: "Risk management strategy, appetite, and tolerance are established and communicated."
  - id: "CSF.GV.RR"
    title: "Roles, Responsibilities, and Authorities"
    section: "GOVERN"
    description: "Cybersecurity roles and accountability are defined and coordinated."
  - id: "CSF.GV.PO"
    title: "Policy"
    section: "GOVERN"
    description: "Cybersecurity policy is established, approved, and maintained."
  - id: "CSF.GV.OV"
    title: "Oversight"
    section: "GOVERN"
    description: "Oversight bodies monitor cybersecurity strategy and execution."
  - id: "CSF.GV.SC"
    title: "Cybersecurity Supply Chain Risk Management"
    section: "GOVERN"
    description: "Supply chain cybersecurity risks are identified and managed."

  - id: "CSF.ID.AM"
    title: "Asset Management"
    section: "IDENTIFY"
    description: "Assets and dependencies are inventoried and managed."
  - id: "CSF.ID.RA"
    title: "Risk Assessment"
    section: "IDENTIFY"
    description: "Cybersecurity risks are identified, analyzed, and prioritized."
  - id: "CSF.ID.IM"
    title: "Improvement"
    section: "IDENTIFY"
    description: "Identify function outcomes are continuously improved."

  - id: "CSF.PR.AA"
    title: "Identity Management, Authentication, and Access Control"
    section: "PROTECT"
    description: "Identity and access are managed to protect assets and data."
  - id: "CSF.PR.AT"
    title: "Awareness and Training"
    section: "PROTECT"
    description: "Personnel and partners are trained for cybersecurity responsibilities."
  - id: "CSF.PR.DS"
    title: "Data Security"
    section: "PROTECT"
    description: "Data is protected in accordance with risk strategy."
  - id: "CSF.PR.PS"
    title: "Platform Security"
    section: "PROTECT"
    description: "Platforms and infrastructure are secured and maintained."
  - id: "CSF.PR.IR"
    title: "Technology Resilience"
    section: "PROTECT"
    description: "Resilience mechanisms preserve essential operations."

  - id: "CSF.DE.CM"
    title: "Continuous Monitoring"
    section: "DETECT"
    description: "Networks, systems, and environments are continuously monitored."
  - id: "CSF.DE.AE"
    title: "Adverse Event Analysis"
    section: "DETECT"
    description: "Detected events are analyzed to determine impact and response."

  - id: "CSF.RS.MA"
    title: "Incident Management"
    section: "RESPOND"
    description: "Incident response is coordinated and managed."
  - id: "CSF.RS.AN"
    title: "Incident Analysis"
    section: "RESPOND"
    description: "Incidents are investigated to scope and contain impact."
  - id: "CSF.RS.CO"
    title: "Incident Response Reporting and Communication"
    section: "RESPOND"
    description: "Response communications are timely and stakeholder-appropriate."
  - id: "CSF.RS.MI"
    title: "Incident Mitigation"
    section: "RESPOND"
    description: "Mitigation actions are executed to reduce incident impact."

  - id: "CSF.RC.RP"
    title: "Recovery Plan Execution"
    section: "RECOVER"
    description: "Recovery activities restore capabilities and services."
  - id: "CSF.RC.CO"
    title: "Recovery Communications"
    section: "RECOVER"
    description: "Recovery status and decisions are communicated to stakeholders."
