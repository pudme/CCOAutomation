---
framework:
  name: "ISO 9001:2015"
  version: "2015"
  short_name: "iso9001"
  description: "Quality management systems — Requirements"
  certification_body: "External auditor (surveillance audit May 2026)"
  active: true

controls:
  - id: "4.1"
    title: Understanding the organization and its context
    domain: Context of the Organization
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Internal and external issues register
    maps_to:
      iso27001: [A.5.1]
      iso20000: ["4.1"]

  - id: "5.1"
    title: Leadership and commitment
    domain: Leadership
    owner_default: Chief Executive Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Management review minutes demonstrating leadership commitment
    maps_to:
      iso27001: [A.5.4]
      iso20000: ["5.1"]

  - id: "5.2"
    title: Quality policy
    domain: Leadership
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Quality policy approved by top management
    maps_to:
      iso27001: [A.5.1]
      iso20000: ["5.2"]

  - id: "5.3"
    title: Organizational roles, responsibilities and authorities
    domain: Leadership
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Roles and responsibilities document
    maps_to:
      iso27001: [A.5.2]
      iso20000: ["5.3"]

  - id: "6.1"
    title: Actions to address risks and opportunities
    domain: Planning
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Risk register covering quality risks
      - type: record
        description: Risk treatment plan
    maps_to:
      iso27001: [A.5.7]
      iso20000: ["6.1"]

  - id: "6.2"
    title: Quality objectives and planning to achieve them
    domain: Planning
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Quality objectives with measurable targets and plans
    maps_to:
      iso20000: ["6.2"]

  - id: "7.1"
    title: Resources
    domain: Support
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Resource planning evidence
    maps_to:
      iso20000: ["7.1"]

  - id: "7.2"
    title: Competence
    domain: Support
    owner_default: Human Resources
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Training records demonstrating staff competence
    maps_to:
      iso27001: [A.6.3]
      iso20000: ["7.2"]

  - id: "7.3"
    title: Awareness
    domain: Support
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Awareness program evidence
    maps_to:
      iso27001: [A.6.3]
      iso20000: ["7.3"]

  - id: "7.4"
    title: Communication
    domain: Support
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Internal and external communication records
    maps_to:
      iso20000: ["7.4"]

  - id: "7.5"
    title: Documented information
    domain: Support
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Document control records and version history
    maps_to:
      iso27001: [A.5.33]
      iso20000: ["7.5"]

  - id: "8.1"
    title: Operational planning and control
    domain: Operation
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Operational procedures and controls
    maps_to:
      iso27001: [A.5.37]
      iso20000: ["8.1"]

  - id: "8.2"
    title: Requirements for products and services
    domain: Operation
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Customer requirements documentation and review records
    maps_to:
      iso20000: ["8.2"]

  - id: "8.4"
    title: Control of externally provided processes, products and services
    domain: Operation
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Supplier evaluation and monitoring records
    maps_to:
      iso27001: [A.5.19, A.5.22]
      iso20000: ["8.3"]

  - id: "8.5"
    title: Production and service provision
    domain: Operation
    owner_default: IT
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Service delivery records and controls
    maps_to:
      iso20000: ["8.5"]

  - id: "8.7"
    title: Control of nonconforming outputs
    domain: Operation
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Nonconforming output records and disposition evidence
    maps_to:
      iso20000: ["10.1"]

  - id: "9.1"
    title: Monitoring, measurement, analysis and evaluation
    domain: Performance Evaluation
    owner_default: Chief Compliance Officer
    review_cadence_days: 180
    evidence_required:
      - type: record
        description: Performance monitoring reports and KPI results
    maps_to:
      iso20000: ["9.1"]

  - id: "9.2"
    title: Internal audit
    domain: Performance Evaluation
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Internal audit report and signed audit program
    maps_to:
      iso27001: [A.5.35]
      iso20000: ["9.2"]

  - id: "9.3"
    title: Management review
    domain: Performance Evaluation
    owner_default: Chief Executive Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Management review meeting minutes
    maps_to:
      iso20000: ["9.3"]

  - id: "10.1"
    title: Continual improvement
    domain: Improvement
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Continual improvement records and initiatives
    maps_to:
      iso20000: ["10.2"]

  - id: "10.2"
    title: Nonconformity and corrective action
    domain: Improvement
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: record
        description: Corrective action records with root cause and effectiveness review
    maps_to:
      iso20000: ["10.1"]
