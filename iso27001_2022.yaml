---
# ISO/IEC 27001:2022 Framework Configuration
# All 93 Annex A controls. Load with: python cli.py load-framework config/frameworks/iso27001_2022.yaml
#
# Cross-mappings reference CMMC Level 2 practice IDs and NIST SP 800-171 Rev 2 section IDs.
# Maps_to entries are added as the CMMC framework config is loaded — they reference controls
# that must already exist in the DB. Load iso27001_2022.yaml before cmmc_level2.yaml.

framework:
  name: "ISO/IEC 27001:2022"
  version: "2022"
  short_name: "iso27001"
  description: "Information security management systems — Requirements"
  certification_body: "External auditor (surveillance audit May 2026)"
  active: true

controls:

  # -------------------------------------------------------------------------
  # DOMAIN: Organizational Controls (A.5) — 37 controls
  # -------------------------------------------------------------------------

  - id: A.5.1
    title: Policies for information security
    domain: Organizational Controls
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
    evidence_required:
      - type: policy
        description: Current approved Information Security Policy (IS Policy V1.2+)
      - type: record
        description: Signed approval / management sign-off with date
    maps_to:
      cmmc: [AC.L1-3.1.1]
      nist_800_171: ["3.1.1"]

  - id: A.5.2
    title: Information security roles and responsibilities
    domain: Organizational Controls
    owner_default: Chief Compliance Officer
    review_cadence_days: 365
